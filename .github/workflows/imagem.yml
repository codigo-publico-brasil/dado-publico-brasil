name: Imagem

# Constrói a imagem do pipeline em todo PR (pega erro do Dockerfile) e a publica no GHCR quando o código entra na main.
# O servidor só faz `pull` (docs/02-fazer/04-operar-e-publicar.md). Não leva segredo: `.env` e `data_store` ficam fora.
on:
  pull_request:
    paths: [Dockerfile, pyproject.toml, uv.lock, dagster.yaml, ".github/workflows/imagem.yml"]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: GIT_SHA=${{ github.sha }}
          # SBOM e atestado de procedência anexados à imagem no GHCR (ação oficial do Docker, sem segredo novo).
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/codigo-publico-brasil/dado-publico-brasil:latest
            ghcr.io/codigo-publico-brasil/dado-publico-brasil:${{ github.sha }}
