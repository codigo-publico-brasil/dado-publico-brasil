name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Um push novo no mesmo PR cancela a execução antiga (a de `main` nunca é cancelada).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2  # no PR, HEAD é o merge com a base: HEAD^1 é a base
      - name: O PR só mexe em documentação?
        id: docs
        # Só em pull_request. Push em `main` roda tudo. Documentação = docs/, site/, *.md e os arquivos de licença.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && ! git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|site/)|\.md$|^(LICENSE|NOTICE|CITATION\.cff)$'; then
            echo "so_docs=true" >> "$GITHUB_OUTPUT"
            echo "PR só de documentação: roda o subconjunto rápido (links, nomes, contratos e núcleo)."
          else
            echo "so_docs=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked --all-extras
      - name: Testes rápidos (PR só de documentação)
        if: steps.docs.outputs.so_docs == 'true'
        run: uv run pytest tests/test_docs_links.py tests/test_no_names.py tests/test_repository_contracts.py tests/test_nucleo_sem_nomes_de_fonte.py
      - run: uv run ruff check .
        if: steps.docs.outputs.so_docs != 'true'
      - run: uv run ruff format --check .
        if: steps.docs.outputs.so_docs != 'true'
      - run: uv run mypy
        if: steps.docs.outputs.so_docs != 'true'
      - name: Testes com cobertura (relatório, sem piso, ADR 0048)
        if: steps.docs.outputs.so_docs != 'true'
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Resumo da cobertura por arquivo
        if: always() && steps.docs.outputs.so_docs != 'true'
        run: |
          echo '### Cobertura dos testes' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --skip-covered >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  dependencias:
    # Reprova em qualquer vulnerabilidade conhecida (base OSV) das dependências travadas no uv.lock (ADR 0003).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
      - run: uv audit --locked --preview-features audit-command
      - name: SBOM do Python (CycloneDX 1.5, do uv.lock; mesmas dependências da imagem)
        run: uv export --locked --all-extras --no-dev --no-emit-project --format cyclonedx1.5 --output-file sbom-python.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-python
          path: sbom-python.cdx.json

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Instala o gitleaks (binário, sem licença paga)
        # A soma SHA-256 é a do `gitleaks_8.28.0_checksums.txt`, publicado na release; trocar versão e soma juntas.
        run: |
          curl -sSfLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --redact --verbose
