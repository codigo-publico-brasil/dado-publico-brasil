# O arquivo do warehouse vem da configuração central (PLATAFORMA_WAREHOUSE_FILE, definido pelo
# pipeline).
quem_decidiu:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('PLATAFORMA_WAREHOUSE_FILE', '../data_store/warehouse.duckdb') }}"
      schema: main

# O `edr` (relatório do Elementary) lê o esquema do perfil como o esquema do Elementary.
elementary:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('PLATAFORMA_WAREHOUSE_FILE', '../data_store/warehouse.duckdb') }}"
      schema: elementary
