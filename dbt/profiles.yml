# O arquivo do warehouse vem da configuração central (DADO_PUBLICO_WAREHOUSE_FILE, definido pelo
# pipeline).
dado_publico_brasil:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DADO_PUBLICO_WAREHOUSE_FILE', '../data_store/warehouse.duckdb') }}"
      schema: main
      attach:  # `metadata` e `identity` moram no estado, só para leitura (ADR 0051)
        - path: "{{ env_var('DADO_PUBLICO_ESTADO_FILE', '../data_store/estado.duckdb') }}"
          alias: estado
          read_only: true
      settings:
        memory_limit: "{{ env_var('DADO_PUBLICO_DUCKDB_MEMORY', '80%') }}"  # acima disso o DuckDB usa o disco

# O `edr` (relatório do Elementary) lê o esquema do perfil como o esquema do Elementary.
elementary:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DADO_PUBLICO_WAREHOUSE_FILE', '../data_store/warehouse.duckdb') }}"
      schema: elementary
