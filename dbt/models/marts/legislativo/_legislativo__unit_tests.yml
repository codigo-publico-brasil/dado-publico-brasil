version: 2

unit_tests:
  - name: chapa_eleita_liga_vice_e_suplentes_pelo_numero_e_ignora_o_substituido
    description: >
      O vice e os suplentes entram pelo número do titular, na mesma unidade, eleição e turno; o candidato substituído
      (sem resultado de eleito) e a chapa de outro estado ficam de fora.
    model: eleitos_chapas
    given:
      - input: ref('stg_tse__candidaturas')
        rows:
          - {id_candidatura: "2022:SP:1", ano_eleicao: 2022, turno: 1, ue: SP, uf: SP, numero: "22", cargo: Governador, resultado: Eleito, nome: Governadora}
          - {id_candidatura: "2022:SP:2", ano_eleicao: 2022, turno: 1, ue: SP, uf: SP, numero: "22", cargo: Vice-governador, resultado: null, nome: Vice Substituido}
          - {id_candidatura: "2022:SP:3", ano_eleicao: 2022, turno: 1, ue: SP, uf: SP, numero: "22", cargo: Vice-governador, resultado: Eleito, nome: Vice Eleito}
          - {id_candidatura: "2022:SP:4", ano_eleicao: 2022, turno: 1, ue: SP, uf: SP, numero: "55", cargo: Vice-governador, resultado: Não eleito, nome: Vice Perdedor}
          - {id_candidatura: "2022:RJ:5", ano_eleicao: 2022, turno: 1, ue: RJ, uf: RJ, numero: "22", cargo: Vice-governador, resultado: Eleito, nome: Vice de Outro Estado}
          - {id_candidatura: "2022:SP:6", ano_eleicao: 2022, turno: 1, ue: SP, uf: SP, numero: "123", cargo: Senador, resultado: Eleito por qp, nome: Senador}
          - {id_candidatura: "2022:SP:7", ano_eleicao: 2022, turno: 1, ue: SP, uf: SP, numero: "123", cargo: 1º suplente, resultado: Eleito, nome: Primeiro Suplente}
          - {id_candidatura: "2022:SP:8", ano_eleicao: 2022, turno: 1, ue: SP, uf: SP, numero: "123", cargo: 2º suplente, resultado: Eleito, nome: Segundo Suplente}
      - input: ref('stg_metadata__captures')
        rows: []
    expect:
      rows:
        - {id_candidatura_titular: "2022:SP:1", id_candidatura: "2022:SP:3", papel: Vice-governador, cargo_titular: Governador, nome: Vice Eleito}
        - {id_candidatura_titular: "2022:SP:6", id_candidatura: "2022:SP:7", papel: 1º suplente, cargo_titular: Senador, nome: Primeiro Suplente}
        - {id_candidatura_titular: "2022:SP:6", id_candidatura: "2022:SP:8", papel: 2º suplente, cargo_titular: Senador, nome: Segundo Suplente}
