          - {id_pessoa: 4, base: votos, id_partido: 8, ano_referencia: 2020, dt_inicio: "2020-01-01", dt_ultimo_registro: "2020-12-31"}
          - {id_pessoa: 5, base: votos, id_partido: 8, ano_referencia: 2021, dt_inicio: "2021-01-01", dt_ultimo_registro: "2021-12-31"}
          - {id_pessoa: 6, base: historico_de_deputados, id_partido: 1, ano_referencia: 2019, dt_inicio: "2019-01-01", dt_ultimo_registro: "2020-12-31"}
