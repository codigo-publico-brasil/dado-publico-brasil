  - name: partido_informado_vale_so_para_periodo_do_historico_que_contem_o_inicio_e_o_derivado_olha_ate_o_ano_do_inicio
    description: >
      O partido é informado quando um período do histórico da Câmara (só essa base, com partido) contém o início do
      exercício, com os dois limites incluídos, e vence o de início mais recente se houver dois. Sem período que o
      contenha, o derivado é o da linha mais recente até o ano do início, de qualquer base, sem usar anos futuros. Sem
      nenhuma linha até lá, partido e base ficam vazios.
    model: fct_exercicios
    given:
      - input: ref('stg_camara__deputados_historico')
        rows: []
      - input: ref('stg_senado__exercicios')
        rows:
          - {id_exercicio: z1, id_senador: "1", participacao: Titular, uf: SP, dt_inicio: "2020-01-10", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
