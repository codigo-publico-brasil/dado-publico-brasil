          - {id_exercicio: z6, id_senador: "6", participacao: Titular, uf: SP, dt_inicio: "2020-06-01", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
      - input: ref('dim_legislaturas')
        rows: []
      - input: ref('stg_metadata__capturas')
        rows: []
      - input: ref('stg_identity__pessoas_identificadores')
        rows:
          - {fonte: senado, id_tipo: senador, id_na_fonte: "1", id_pessoa: 1}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "2", id_pessoa: 2}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "3", id_pessoa: 3}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "4", id_pessoa: 4}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "5", id_pessoa: 5}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "6", id_pessoa: 6}
      - input: ref('dim_territorios')
        rows: []
      - input: ref('fct_mandatos')
        rows: []
      - input: ref('fct_pessoas_partidos')
        rows:
          - {id_pessoa: 1, base: historico_de_deputados, id_partido: 5, ano_referencia: 2020, dt_inicio: "2020-01-10", dt_ultimo_registro: "2020-03-10"}
          - {id_pessoa: 2, base: historico_de_deputados, id_partido: 5, ano_referencia: 2020, dt_inicio: "2020-01-10", dt_ultimo_registro: "2020-03-10"}
          - {id_pessoa: 3, base: historico_de_deputados, id_partido: 7, ano_referencia: 2020, dt_inicio: "2020-01-01", dt_ultimo_registro: "2020-01-10"}
