  - name: mandato_cumprido_aceita_o_limite_de_31_dias_e_o_ultimo_dia_e_escolhe_o_mais_recente_do_mesmo_cargo
    description: >
      O exercício cumpre o mandato da mesma pessoa e do mesmo cargo se começa entre 31 dias antes da posse e o fim
      previsto, com os dois limites incluídos; 32 dias antes, um dia depois do fim, outro cargo ou pessoa sem
      identificador não cumprem. Com dois mandatos possíveis vence o de posse mais recente. A UF sem linha em
      dim_territorios deixa o território vazio.
    model: fct_exercicios
    given:
      - input: ref('stg_camara__deputados_historico')
        rows: []
      - input: ref('stg_senado__exercicios')
        rows:
          - {id_exercicio: y1, id_senador: "1", participacao: Titular, uf: SP, dt_inicio: "2019-01-01", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
          - {id_exercicio: y2, id_senador: "2", participacao: Titular, uf: ZZ, dt_inicio: "2018-12-31", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
          - {id_exercicio: y3, id_senador: "3", participacao: Titular, uf: SP, dt_inicio: "2027-01-31", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
          - {id_exercicio: y4, id_senador: "4", participacao: Titular, uf: SP, dt_inicio: "2027-02-01", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
