          - {id_exercicio: y6, id_senador: "6", participacao: Titular, uf: SP, dt_inicio: "2019-02-01", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
          - {id_exercicio: y7, id_senador: "7", participacao: Titular, uf: SP, dt_inicio: "2019-02-01", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
      - input: ref('dim_legislaturas')
        rows: []
      - input: ref('stg_metadata__capturas')
        rows: []
      - input: ref('stg_identity__pessoas_identificadores')
        rows:
          - {fonte: senado, id_tipo: senador, id_na_fonte: "1", id_pessoa: 1}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "2", id_pessoa: 2}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "3", id_pessoa: 3}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "4", id_pessoa: 4}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "5", id_pessoa: 5}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "6", id_pessoa: 6}
      - input: ref('dim_territorios')
        rows:
          - {id_territorio: "35", tipo: uf, sigla: SP}
      - input: ref('fct_mandatos')
        rows:
          - {id_candidatura: mand1, id_pessoa: 1, id_cargo: senador, dt_inicio: "2019-02-01", dt_fim_prevista: "2027-01-31"}
          - {id_candidatura: mand2, id_pessoa: 2, id_cargo: senador, dt_inicio: "2019-02-01", dt_fim_prevista: "2027-01-31"}
          - {id_candidatura: mand3, id_pessoa: 3, id_cargo: senador, dt_inicio: "2019-02-01", dt_fim_prevista: "2027-01-31"}
          - {id_candidatura: mand4, id_pessoa: 4, id_cargo: senador, dt_inicio: "2019-02-01", dt_fim_prevista: "2027-01-31"}
          - {id_candidatura: mand5a, id_pessoa: 5, id_cargo: senador, dt_inicio: "2019-02-01", dt_fim_prevista: "2027-01-31"}
          - {id_candidatura: mand5b, id_pessoa: 5, id_cargo: senador, dt_inicio: "2023-02-01", dt_fim_prevista: "2031-01-31"}
          - {id_candidatura: mand6, id_pessoa: 6, id_cargo: deputado_federal, dt_inicio: "2019-02-01", dt_fim_prevista: "2027-01-31"}
      - input: ref('fct_pessoas_partidos')
        rows: []
    expect:
      rows:
        - {id_exercicio: senado-y1, id_pessoa: 1, id_territorio: "35", id_candidatura: mand1}
