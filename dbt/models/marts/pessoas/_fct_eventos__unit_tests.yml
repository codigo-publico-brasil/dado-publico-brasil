    given:
      - input: ref('dim_pessoas')
        rows: []
      - input: ref('int_pessoas_unidas_cadastro')
        rows: []
      - input: ref('int_pessoas_senado_unidas')
        rows: []
      - input: ref('fct_candidaturas')
        rows: []
      - input: ref('stg_tse__candidaturas')
        rows: []
      - input: ref('dim_disputas')
        rows: []
      - input: ref('fct_mandatos')
        rows: []
      - input: ref('fct_exercicios')
        rows:
          - {id_exercicio: e1, id_pessoa: 1, id_cargo: senador, condicao_na_fonte: 1º Suplente, dt_inicio: "2020-03-01", dt_fim: "2020-09-01", causa_fim: Retorno do titular, id_captura: 1}
          - {id_exercicio: e2, id_pessoa: 2, id_cargo: senador, condicao_na_fonte: EFETIVADO, dt_inicio: "2020-03-01", dt_fim: "2021-01-31", causa_fim: Renúncia ao mandato, id_captura: 1}
          - {id_exercicio: e3, id_pessoa: 3, id_cargo: senador, condicao_na_fonte: Titular, dt_inicio: "2019-02-01", dt_fim: null, causa_fim: Término, id_captura: 1}
