          - {id_exercicio: e5, id_pessoa: 5, id_cargo: senador, condicao_na_fonte: Titular, dt_inicio: "2019-02-01", dt_fim: "2020-05-05", causa_fim: Cassação do mandato, id_captura: 1}
          - {id_exercicio: e6, id_pessoa: 6, id_cargo: senador, condicao_na_fonte: Titular, dt_inicio: "2019-02-01", dt_fim: "2020-06-06", causa_fim: Licença médica, id_captura: 1}
          - {id_exercicio: e7, id_pessoa: 7, id_cargo: senador, condicao_na_fonte: Titular, dt_inicio: "2019-02-01", dt_fim: "2020-07-07", causa_fim: null, id_captura: 1}
          - {id_exercicio: e8, id_pessoa: null, id_cargo: senador, condicao_na_fonte: Suplente, dt_inicio: "2019-02-01", dt_fim: "2020-07-07", causa_fim: null, id_captura: 1}
      - input: ref('fct_pessoas_partidos')
        rows: []
      - input: ref('brg_orgaos_membros')
        rows: []
      - input: ref('stg_metadata__capturas')
        rows:
          - {id_captura: 1, fonte: senado, dt_captura: "2026-10-22 10:00:00"}
    expect:
      rows:
        - {id_evento: "assuncao_por_suplencia:fct_exercicios:e1", id_pessoa: 1, ano_evento: 2020, dt_evento: "2020-03-01", id_cargo: senador, base: informado, fonte: senado, dt_captura: "2026-10-22"}
        - {id_evento: "assuncao_por_suplencia:fct_exercicios:e2", id_pessoa: 2, ano_evento: 2020, dt_evento: "2020-03-01", id_cargo: senador, base: informado, fonte: senado, dt_captura: "2026-10-22"}
