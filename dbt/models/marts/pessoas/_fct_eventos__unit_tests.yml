  - name: evento_de_troca_de_partido_compara_com_o_partido_anterior_da_pessoa_ignorando_linha_sem_partido
    description: >
      Troca de partido é o momento em que o partido difere do anterior da mesma pessoa, na ordem do ano, da data (sem
      data vem primeiro) e da fonte. A primeira linha, a repetição do mesmo partido e a pessoa sem uma segunda linha não
      geram evento; a linha sem partido (ou sem pessoa) é descartada antes de comparar, então não esconde a troca.
    model: fct_eventos
    given:
      - input: ref('dim_pessoas')
        rows: []
      - input: ref('int_pessoas_unidas_cadastro')
        rows: []
      - input: ref('int_pessoas_senado_unidas')
        rows: []
      - input: ref('fct_candidaturas')
        rows: []
      - input: ref('stg_tse__candidaturas')
        rows: []
      - input: ref('dim_disputas')
        rows: []
      - input: ref('fct_mandatos')
        rows: []
      - input: ref('fct_exercicios')
        rows: []
      - input: ref('fct_pessoas_partidos')
        rows:
          - {id_pessoa: 1, id_pessoa_partido: r1, fonte: camara, ano_referencia: 2019, dt_inicio: "2019-02-01", id_partido: 1}
          - {id_pessoa: 1, id_pessoa_partido: r3, fonte: camara, ano_referencia: 2020, dt_inicio: "2020-02-01", id_partido: null}
          - {id_pessoa: 1, id_pessoa_partido: r2, fonte: camara, ano_referencia: 2021, dt_inicio: "2021-02-01", id_partido: 2}
          - {id_pessoa: 1, id_pessoa_partido: r4, fonte: camara, ano_referencia: 2022, dt_inicio: "2022-02-01", id_partido: 2}
          - {id_pessoa: 1, id_pessoa_partido: r5, fonte: tse, ano_referencia: 2023, dt_inicio: null, id_partido: 1}
          - {id_pessoa: 2, id_pessoa_partido: s1, fonte: tse, ano_referencia: 2018, dt_inicio: null, id_partido: 1}
          - {id_pessoa: 2, id_pessoa_partido: s2, fonte: camara, ano_referencia: 2018, dt_inicio: "2018-03-01", id_partido: 2}
          - {id_pessoa: 3, id_pessoa_partido: t1, fonte: camara, ano_referencia: 2018, dt_inicio: "2018-03-01", id_partido: 1}
          - {id_pessoa: null, id_pessoa_partido: u1, fonte: camara, ano_referencia: 2018, dt_inicio: "2018-03-01", id_partido: 1}
          - {id_pessoa: null, id_pessoa_partido: u2, fonte: camara, ano_referencia: 2019, dt_inicio: "2019-03-01", id_partido: 2}
      - input: ref('brg_orgaos_membros')
        rows: []
      - input: ref('stg_metadata__capturas')
        rows: []
    expect:
      rows:
        - {id_evento: "troca_de_partido:fct_pessoas_partidos:r2", id_pessoa: 1, ano_evento: 2021, dt_evento: "2021-02-01", id_partido: 2, base: informado}
        - {id_evento: "troca_de_partido:fct_pessoas_partidos:r5", id_pessoa: 1, ano_evento: 2023, dt_evento: null, id_partido: 1, base: informado}
        - {id_evento: "troca_de_partido:fct_pessoas_partidos:s2", id_pessoa: 2, ano_evento: 2018, dt_evento: "2018-03-01", id_partido: 2, base: informado}

  - name: evento_de_orgao_traz_entrada_e_saida_com_o_orgao_do_dim_orgaos_sem_repetir_a_linha_duplicada_da_fonte
    description: >
      Cada participação em órgão gera a entrada (no início) e, se encerrada, a saída (no fim), ambas com o órgão como chave
      de dim_orgaos (fonte e identificador da fonte). A mesma participação repetida pela fonte, uma aberta e outra
      encerrada, gera uma só entrada e uma só saída. Sem data de início não há entrada; sem data de fim não há saída; sem
      pessoa não há evento.
    model: fct_eventos
    given:
      - input: ref('dim_pessoas')
        rows: []
      - input: ref('int_pessoas_unidas_cadastro')
        rows: []
      - input: ref('int_pessoas_senado_unidas')
        rows: []
      - input: ref('fct_candidaturas')
        rows: []
      - input: ref('stg_tse__candidaturas')
        rows: []
      - input: ref('dim_disputas')
        rows: []
      - input: ref('fct_mandatos')
        rows: []
      - input: ref('fct_exercicios')
        rows: []
      - input: ref('fct_pessoas_partidos')
        rows: []
      - input: ref('brg_orgaos_membros')
        rows:
