        - {id_evento: "termino_de_mandato:fct_exercicios:e4", id_pessoa: 4, ano_evento: 2023, dt_evento: "2023-01-31", id_cargo: senador, base: informado, fonte: senado, dt_captura: "2026-10-22"}
        - {id_evento: "cassacao_de_mandato:fct_exercicios:e5", id_pessoa: 5, ano_evento: 2020, dt_evento: "2020-05-05", id_cargo: senador, base: informado, fonte: senado, dt_captura: "2026-10-22"}
