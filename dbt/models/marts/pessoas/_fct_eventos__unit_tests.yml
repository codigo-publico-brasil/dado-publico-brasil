version: 2

# Testes unitários de fct_eventos (dados sintéticos e genéricos). Rodam com `dbt test --select test_type:unit`.
unit_tests:
  - name: evento_de_vida_nasce_so_com_data_conhecida_e_o_primeiro_de_janeiro_do_tse_fica_sem_dia
    description: >
      O nascimento vira evento com o ano sempre; o dia só vale quando a fonte o dá: o 1º de janeiro vindo do TSE é
      marcador de dia desconhecido e fica sem dia (o de outra fonte e outras datas do TSE ficam). O falecimento vem do
      cadastro da Câmara primeiro, depois do Senado, com a captura do cadastro que o informa; sem data não há evento.
    model: fct_eventos
    given:
      - input: ref('dim_pessoas')
        rows:
          - {id_pessoa: 1, dt_nascimento: "1980-05-10", fonte_dt_nascimento: camara}
          - {id_pessoa: 2, dt_nascimento: "1975-01-01", fonte_dt_nascimento: tse}
          - {id_pessoa: 3, dt_nascimento: "1975-01-01", fonte_dt_nascimento: camara}
          - {id_pessoa: 4, dt_nascimento: "1970-01-02", fonte_dt_nascimento: tse}
          - {id_pessoa: 5, dt_nascimento: null, fonte_dt_nascimento: null}
      - input: ref('int_pessoas_unidas_cadastro')
        rows:
          - {id_pessoa: 1, dt_falecimento: "2020-03-03", id_captura: 1}
          - {id_pessoa: 7, dt_falecimento: null, id_captura: 1}
      - input: ref('int_pessoas_senado_unidas')
        rows:
          - {id_pessoa: 1, dt_falecimento: "2020-04-04", id_captura: 2}
          - {id_pessoa: 6, dt_falecimento: "2021-02-02", id_captura: 2}
      - input: ref('fct_candidaturas')
        rows: []
      - input: ref('stg_tse__candidaturas')
        rows: []
      - input: ref('dim_disputas')
        rows: []
      - input: ref('fct_mandatos')
        rows: []
      - input: ref('fct_exercicios')
        rows: []
      - input: ref('fct_pessoas_partidos')
        rows: []
      - input: ref('brg_orgaos_membros')
        rows: []
      - input: ref('stg_metadata__capturas')
        rows:
          - {id_captura: 1, fonte: camara, dt_captura: "2026-10-21 10:00:00"}
          - {id_captura: 2, fonte: senado, dt_captura: "2026-10-22 10:00:00"}
    expect:
      rows:
        - {id_evento: "nascimento:dim_pessoas:1", id_pessoa: 1, id_tipo_evento: nascimento, ano_evento: 1980, dt_evento: "1980-05-10", fonte: camara, dt_captura: null}
        - {id_evento: "nascimento:dim_pessoas:2", id_pessoa: 2, id_tipo_evento: nascimento, ano_evento: 1975, dt_evento: null, fonte: tse, dt_captura: null}
        - {id_evento: "nascimento:dim_pessoas:3", id_pessoa: 3, id_tipo_evento: nascimento, ano_evento: 1975, dt_evento: "1975-01-01", fonte: camara, dt_captura: null}
        - {id_evento: "nascimento:dim_pessoas:4", id_pessoa: 4, id_tipo_evento: nascimento, ano_evento: 1970, dt_evento: "1970-01-02", fonte: tse, dt_captura: null}
        - {id_evento: "falecimento:dim_pessoas:1", id_pessoa: 1, id_tipo_evento: falecimento, ano_evento: 2020, dt_evento: "2020-03-03", fonte: camara, dt_captura: "2026-10-21"}
        - {id_evento: "falecimento:dim_pessoas:6", id_pessoa: 6, id_tipo_evento: falecimento, ano_evento: 2021, dt_evento: "2021-02-02", fonte: senado, dt_captura: "2026-10-22"}

  - name: evento_de_candidatura_traz_registro_situacao_resultado_e_segundo_turno_so_de_quem_tem_pessoa
    description: >
      Toda candidatura de quem tem pessoa e ano de eleição gera o registro (só o ano). A situação deferida (Deferido ou
      Apto), indeferida ou cassada gera um evento próprio, e as demais não. Não eleito e suplente levam o dia da
      votação (o partido só no suplente), e o segundo turno é marcado por qtd_turnos = 2. O resultado Eleito não gera
      evento aqui (vem do mandato). O cargo e o território vêm da disputa, vazios quando ela não existe.
    model: fct_eventos
    given:
      - input: ref('dim_pessoas')
        rows: []
      - input: ref('int_pessoas_unidas_cadastro')
        rows: []
      - input: ref('int_pessoas_senado_unidas')
        rows: []
      - input: ref('fct_candidaturas')
        rows:
          - {id_candidatura: k1, id_pessoa: 1, id_disputa: d1, id_partido: 4, situacao_candidatura: Deferido, resultado: Suplente, qtd_turnos: 1, dt_eleicao: "2022-10-02"}
          - {id_candidatura: k2, id_pessoa: 2, id_disputa: d1, id_partido: 4, situacao_candidatura: Apto, resultado: Não eleito, qtd_turnos: 2, dt_eleicao: "2022-10-02"}
          - {id_candidatura: k3, id_pessoa: 3, id_disputa: d1, id_partido: 4, situacao_candidatura: Indeferido com recurso, resultado: Eleito, qtd_turnos: 1, dt_eleicao: "2022-10-02"}
          - {id_candidatura: k4, id_pessoa: 4, id_disputa: d1, id_partido: 4, situacao_candidatura: Cassado, resultado: null, qtd_turnos: 1, dt_eleicao: "2022-10-02"}
          - {id_candidatura: k5, id_pessoa: 5, id_disputa: sem_disputa, id_partido: 4, situacao_candidatura: Renúncia, resultado: Nao eleito, qtd_turnos: 1, dt_eleicao: "2022-10-02"}
          - {id_candidatura: k6, id_pessoa: null, id_disputa: d1, id_partido: 4, situacao_candidatura: Deferido, resultado: Suplente, qtd_turnos: 2, dt_eleicao: "2022-10-02"}
          - {id_candidatura: k7, id_pessoa: 7, id_disputa: d1, id_partido: 4, situacao_candidatura: Deferido, resultado: Suplente, qtd_turnos: 1, dt_eleicao: "2022-10-02"}
      - input: ref('stg_tse__candidaturas')
        rows:
          - {id_candidatura: k1, ano_eleicao: 2022}
          - {id_candidatura: k1, ano_eleicao: 2022}
          - {id_candidatura: k2, ano_eleicao: 2022}
          - {id_candidatura: k3, ano_eleicao: 2022}
          - {id_candidatura: k4, ano_eleicao: 2022}
          - {id_candidatura: k5, ano_eleicao: 2022}
          - {id_candidatura: k6, ano_eleicao: 2022}
      - input: ref('dim_disputas')
        rows:
          - {id_disputa: d1, id_cargo: vereador, id_territorio: A}
      - input: ref('fct_mandatos')
        rows: []
      - input: ref('fct_exercicios')
        rows: []
      - input: ref('fct_pessoas_partidos')
        rows: []
      - input: ref('brg_orgaos_membros')
        rows: []
      - input: ref('stg_metadata__capturas')
        rows: []
    expect:
      rows:
        - {id_evento: "candidatura_registrada:fct_candidaturas:k1", ano_evento: 2022, dt_evento: null, id_cargo: vereador, id_territorio: A, id_partido: 4, base: informado}
        - {id_evento: "candidatura_deferida:fct_candidaturas:k1", ano_evento: 2022, dt_evento: null, id_cargo: vereador, id_territorio: A, id_partido: null, base: informado}
        - {id_evento: "suplente_eleito:fct_candidaturas:k1", ano_evento: 2022, dt_evento: "2022-10-02", id_cargo: vereador, id_territorio: A, id_partido: 4, base: informado}
        - {id_evento: "candidatura_registrada:fct_candidaturas:k2", ano_evento: 2022, dt_evento: null, id_cargo: vereador, id_territorio: A, id_partido: 4, base: informado}
        - {id_evento: "candidatura_deferida:fct_candidaturas:k2", ano_evento: 2022, dt_evento: null, id_cargo: vereador, id_territorio: A, id_partido: null, base: informado}
        - {id_evento: "nao_eleito:fct_candidaturas:k2", ano_evento: 2022, dt_evento: "2022-10-02", id_cargo: vereador, id_territorio: A, id_partido: null, base: informado}
        - {id_evento: "segundo_turno_disputado:fct_candidaturas:k2", ano_evento: 2022, dt_evento: "2022-10-02", id_cargo: vereador, id_territorio: A, id_partido: null, base: informado}
        - {id_evento: "candidatura_registrada:fct_candidaturas:k3", ano_evento: 2022, dt_evento: null, id_cargo: vereador, id_territorio: A, id_partido: 4, base: informado}
        - {id_evento: "candidatura_indeferida:fct_candidaturas:k3", ano_evento: 2022, dt_evento: null, id_cargo: vereador, id_territorio: A, id_partido: null, base: informado}
        - {id_evento: "candidatura_registrada:fct_candidaturas:k4", ano_evento: 2022, dt_evento: null, id_cargo: vereador, id_territorio: A, id_partido: 4, base: informado}
        - {id_evento: "candidatura_cassada:fct_candidaturas:k4", ano_evento: 2022, dt_evento: null, id_cargo: vereador, id_territorio: A, id_partido: null, base: informado}
        - {id_evento: "candidatura_registrada:fct_candidaturas:k5", ano_evento: 2022, dt_evento: null, id_cargo: null, id_territorio: null, id_partido: 4, base: informado}
        - {id_evento: "nao_eleito:fct_candidaturas:k5", ano_evento: 2022, dt_evento: "2022-10-02", id_cargo: null, id_territorio: null, id_partido: null, base: informado}

  - name: evento_de_mandato_traz_eleito_e_posse_com_a_base_de_cada_um_e_so_com_data_de_posse_conhecida
    description: >
      O eleito nasce do mandato que tem candidatura no TSE (ano da eleição) e leva o dia da votação e a base da eleição
      (informado ou derivado); a posse só existe com data de início e leva a base da data. Os dois são independentes:
      sem candidatura no TSE não há evento de eleito, e sem data de início não há posse. Mandato sem pessoa não entra.
    model: fct_eventos
    given:
      - input: ref('dim_pessoas')
        rows: []
      - input: ref('int_pessoas_unidas_cadastro')
        rows: []
      - input: ref('int_pessoas_senado_unidas')
        rows: []
      - input: ref('fct_candidaturas')
        rows:
          - {id_candidatura: m1, id_pessoa: null, dt_eleicao: "2022-10-02"}
      - input: ref('stg_tse__candidaturas')
        rows:
          - {id_candidatura: m1, ano_eleicao: 2022}
          - {id_candidatura: m3, ano_eleicao: 2022}
      - input: ref('dim_disputas')
        rows: []
      - input: ref('fct_mandatos')
        rows:
          - {id_candidatura: m1, id_pessoa: 1, id_disputa: d1, id_cargo: vereador, id_territorio: A, id_partido: 4, base_eleicao: derivado, dt_inicio: "2023-02-01", base_dt_inicio: informado}
          - {id_candidatura: m2, id_pessoa: 2, id_disputa: d1, id_cargo: vereador, id_territorio: A, id_partido: 4, base_eleicao: informado, dt_inicio: null, base_dt_inicio: null}
          - {id_candidatura: m3, id_pessoa: null, id_disputa: d1, id_cargo: vereador, id_territorio: A, id_partido: 4, base_eleicao: informado, dt_inicio: "2023-02-01", base_dt_inicio: informado}
      - input: ref('fct_exercicios')
        rows: []
      - input: ref('fct_pessoas_partidos')
        rows: []
      - input: ref('brg_orgaos_membros')
        rows: []
      - input: ref('stg_metadata__capturas')
        rows: []
    expect:
      rows:
        - {id_evento: "eleito:fct_mandatos:m1", id_pessoa: 1, ano_evento: 2022, dt_evento: "2022-10-02", id_disputa: d1, id_cargo: vereador, id_territorio: A, id_partido: 4, base: derivado}
        - {id_evento: "posse:fct_mandatos:m1", id_pessoa: 1, ano_evento: 2023, dt_evento: "2023-02-01", id_disputa: d1, id_cargo: vereador, id_territorio: A, id_partido: 4, base: informado}

  - name: evento_de_exercicio_traz_assuncao_por_suplencia_e_o_tipo_de_fim_pela_causa_exceto_retorno_do_titular
    description: >
      Assume por suplência quem entra como suplente ou efetivado (sem diferença de caixa); titular não. O fim do
      exercício vira término de mandato, renúncia, cassação ou afastamento (causa vazia ou outra) conforme a causa, e o
      retorno do titular não é evento; sem data de fim não há evento de fim. Exercício sem pessoa não entra. O dia e a
      captura vêm do exercício.
