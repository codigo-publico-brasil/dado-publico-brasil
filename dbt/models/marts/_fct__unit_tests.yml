version: 2

unit_tests:
  - name: mandato_traz_ano_de_inicio_e_tipo_pela_comparacao_com_o_mandato_anterior_da_mesma_pessoa_no_mesmo_cargo_e_unidade
    description: >
      Reeleito é o mandato de um ciclo atrás; retorno, o de um intervalo; novato, o primeiro quando a base já cobria o
      ciclo anterior; sem essa prova o campo fica vazio. Abaixo do nível federal a unidade conta: o vereador que muda de
      município começa de novo. O ano de início é o ano seguinte ao da eleição (dim_eleicoes), mesmo sem data de posse.
    model: fct_mandatos
    given:
      - input: ref('fct_candidaturas')
        rows:
          - {id_candidatura: a14, id_disputa: da14, id_pessoa: 1, id_captura: 1}
          - {id_candidatura: a18, id_disputa: da18, id_pessoa: 1, id_captura: 1}
          - {id_candidatura: a26, id_disputa: da26, id_pessoa: 1, id_captura: 1}
          - {id_candidatura: b22, id_disputa: db22, id_pessoa: 2, id_captura: 1}
          - {id_candidatura: c20, id_disputa: dc20, id_pessoa: 3, id_captura: 1}
          - {id_candidatura: c24, id_disputa: dc24, id_pessoa: 3, id_captura: 1}
          - {id_candidatura: d20, id_disputa: dd20, id_pessoa: 4, id_captura: 1}
      - input: ref('int_tse_eleitos')
        rows:
          - {id_candidatura: a14, base_eleicao: informado}
          - {id_candidatura: a18, base_eleicao: informado}
          - {id_candidatura: a26, base_eleicao: informado}
          - {id_candidatura: b22, base_eleicao: informado}
          - {id_candidatura: c20, base_eleicao: informado}
          - {id_candidatura: c24, base_eleicao: informado}
          - {id_candidatura: d20, base_eleicao: informado}
      - input: ref('dim_disputas')
        rows:
          - {id_disputa: da14, id_eleicao: "2014-1", id_cargo: deputado_federal}
          - {id_disputa: da18, id_eleicao: "2018-1", id_cargo: deputado_federal}
          - {id_disputa: da26, id_eleicao: "2026-1", id_cargo: deputado_federal}
          - {id_disputa: db22, id_eleicao: "2022-1", id_cargo: deputado_federal}
          - {id_disputa: dc20, id_eleicao: "2020-1", id_cargo: vereador, id_territorio: A}
          - {id_disputa: dc24, id_eleicao: "2024-1", id_cargo: vereador, id_territorio: B}
          - {id_disputa: dd20, id_eleicao: "2020-1", id_cargo: vereador, id_territorio: A}
      - input: ref('dim_eleicoes')
        rows:
          - {id_eleicao: "2014-1", ano_eleicao: 2014}
          - {id_eleicao: "2018-1", ano_eleicao: 2018}
          - {id_eleicao: "2020-1", ano_eleicao: 2020}
          - {id_eleicao: "2022-1", ano_eleicao: 2022}
          - {id_eleicao: "2024-1", ano_eleicao: 2024}
          - {id_eleicao: "2026-1", ano_eleicao: 2026}
      - input: ref('dim_cargos')
        rows:
          - {id_cargo: deputado_federal, duracao_anos: 4, esfera: federal}
          - {id_cargo: vereador, duracao_anos: 4, esfera: municipal}
      - input: ref('dim_cargos_posse')
        rows: []
    expect:
      rows:
        - {id_candidatura: a14, ano_inicio: 2015, tipo_mandato: null}
        - {id_candidatura: a18, ano_inicio: 2019, tipo_mandato: reeleito}
        - {id_candidatura: a26, ano_inicio: 2027, tipo_mandato: retorno}
        - {id_candidatura: b22, ano_inicio: 2023, tipo_mandato: novato}
        - {id_candidatura: c20, ano_inicio: 2021, tipo_mandato: null}
        - {id_candidatura: c24, ano_inicio: 2025, tipo_mandato: novato}
        - {id_candidatura: d20, ano_inicio: 2021, tipo_mandato: null}

  - name: exercicio_cumpre_o_mandato_com_janela_de_31_dias_e_o_suplente_fica_sem_candidatura
    description: >
      O exercício que começa até 31 dias antes da posse do mandato (registro antes da posse) cumpre esse mandato; o que
      começa antes disso, ou de quem não foi eleito (suplente), fica sem candidatura. O território vem da UF. O partido é
      o do histórico da Câmara quando há (informado); sem ele, o último registrado até o ano do início (derivado).
    model: fct_exercicios
    given:
      - input: ref('stg_camara__deputados_historico')
        rows:
          - {id_deputado: 10, id_legislatura: 56, dt_registro: "2019-02-01 10:00:00", situacao: Exercício, condicao_eleitoral: Titular, uf_sigla: SP, id_captura: 1}
      - input: ref('stg_senado__exercicios')
        rows:
          - {id_exercicio: x1, id_senador: 20, participacao: Titular, uf: SP, dt_inicio: "2019-01-15", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
          - {id_exercicio: x2, id_senador: 21, participacao: Titular, uf: SP, dt_inicio: "2018-12-31", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
          - {id_exercicio: x3, id_senador: 22, participacao: 1º Suplente, uf: SP, dt_inicio: "2020-03-01", dt_fim: null, dt_mandato_fim: "2027-01-31", causa_afastamento: null, id_captura: 1}
      - input: ref('dim_legislaturas')
        rows:
          - {id_legislatura: 56, dt_fim: "2023-01-31"}
      - input: ref('stg_metadata__capturas')
        rows:
          - {id_captura: 1, url: "https://exemplo.gov.br/arquivo.zip", dt_captura: "2026-10-21 10:00:00"}
      - input: ref('stg_identity__pessoas_identificadores')
        rows:
          - {fonte: camara, id_tipo: deputado, id_na_fonte: "10", id_pessoa: 1}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "20", id_pessoa: 2}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "21", id_pessoa: 3}
          - {fonte: senado, id_tipo: senador, id_na_fonte: "22", id_pessoa: 4}
      - input: ref('dim_territorios')
        rows:
          - {id_territorio: "35", tipo: uf, sigla: SP}
      - input: ref('fct_mandatos')
        rows:
          - {id_candidatura: dep19, id_pessoa: 1, id_cargo: deputado_federal, dt_inicio: "2019-02-01", dt_fim_prevista: "2023-01-31"}
          - {id_candidatura: sen18, id_pessoa: 2, id_cargo: senador, dt_inicio: "2019-02-01", dt_fim_prevista: "2027-01-31"}
          - {id_candidatura: sen18b, id_pessoa: 3, id_cargo: senador, dt_inicio: "2019-02-01", dt_fim_prevista: "2027-01-31"}
      - input: ref('fct_pessoas_partidos')
        rows:
          - {id_pessoa: 1, base: historico_de_deputados, id_partido: 5, ano_referencia: 2019, dt_inicio: "2019-02-01", dt_ultimo_registro: "2019-02-01"}
          - {id_pessoa: 4, base: candidatura, id_partido: 9, ano_referencia: 2018}
          - {id_pessoa: 4, base: votos, id_partido: 8, ano_referencia: 2022}
    expect:
      rows:
        - {id_exercicio: camara-10-56-201902011000, id_candidatura: dep19, id_territorio: "35", id_partido: 5, base_partido: informado}
        - {id_exercicio: senado-x1, id_candidatura: sen18, id_territorio: "35", id_partido: null, base_partido: null}
        - {id_exercicio: senado-x2, id_candidatura: null, id_territorio: "35", id_partido: null, base_partido: null}
        - {id_exercicio: senado-x3, id_candidatura: null, id_territorio: "35", id_partido: 9, base_partido: derivado}

  - name: ocupacao_vem_do_exercicio_publicado_e_o_mandato_cobre_so_o_que_nao_tem_exercicio
    description: >
      O exercício publicado vence: o mandato cumprido por ele (id_candidatura) não gera outra linha. Fim real quando a
      fonte registra; senão o fim do mandato, previsto. O suplente que assumiu entra sem candidatura, e o eleito que
      ainda não assumiu entra pelo mandato, com ano de início e sem data. O partido da candidatura vence; sem ela, vale o
      do exercício (informado ou derivado).
    model: fct_cargos_ocupacoes
    given:
      - input: ref('fct_mandatos')
        rows:
          - {fonte: tse, id_candidatura: s18a, id_pessoa: 1, id_territorio: null, id_cargo: senador, id_partido: 7, ano_inicio: 2019, dt_inicio: "2019-02-01", base_dt_inicio: derivado, dt_fim_prevista: "2027-01-31", id_captura: 1, dt_captura: "2026-10-21"}
          - {fonte: tse, id_candidatura: s18b, id_pessoa: 2, id_territorio: null, id_cargo: senador, id_partido: 7, ano_inicio: 2019, dt_inicio: "2019-02-01", base_dt_inicio: derivado, dt_fim_prevista: "2027-01-31", id_captura: 1, dt_captura: "2026-10-21"}
          - {fonte: tse, id_candidatura: s26, id_pessoa: 5, id_territorio: null, id_cargo: senador, id_partido: 7, ano_inicio: 2027, dt_inicio: "2027-02-01", base_dt_inicio: derivado, dt_fim_prevista: "2035-01-31", id_captura: 1, dt_captura: "2026-10-21"}
          - {fonte: tse, id_candidatura: g22, id_pessoa: 6, id_partido: null, id_cargo: governador, id_territorio: "35", ano_inicio: 2023, dt_inicio: "2023-01-01", base_dt_inicio: derivado, dt_fim_prevista: "2026-12-31", id_captura: 1, dt_captura: "2026-10-21"}
          - {fonte: tse, id_candidatura: v26, id_pessoa: 7, id_cargo: deputado_estadual, id_territorio: "35", id_partido: 7, ano_inicio: 2027, dt_inicio: null, base_dt_inicio: null, dt_fim_prevista: null, id_captura: 1, dt_captura: "2026-10-21"}
          - {fonte: tse, id_candidatura: d22, id_pessoa: 8, id_territorio: null, id_cargo: deputado_federal, id_partido: 7, ano_inicio: 2023, dt_inicio: "2023-02-01", base_dt_inicio: derivado, dt_fim_prevista: "2027-01-31", id_captura: 1, dt_captura: "2026-10-21"}
      - input: ref('fct_exercicios')
        rows:
          - {fonte: senado, id_exercicio: e1, id_pessoa: 1, id_cargo: senador, id_territorio: "35", id_candidatura: s18a, id_partido: 9, base_partido: derivado, dt_inicio: "2019-02-01", dt_fim: null, dt_mandato_fim: "2027-01-31", id_captura: 1, dt_captura: "2026-10-21"}
          - {fonte: senado, id_exercicio: e2, id_pessoa: 2, id_cargo: senador, id_territorio: "35", id_candidatura: s18b, id_partido: null, base_partido: null, dt_inicio: "2019-02-01", dt_fim: "2019-12-20", dt_mandato_fim: "2027-01-31", id_captura: 1, dt_captura: "2026-10-21"}
          - {fonte: senado, id_exercicio: e3, id_pessoa: 3, id_cargo: senador, id_territorio: "35", id_candidatura: null, id_partido: 9, base_partido: derivado, dt_inicio: "2020-03-01", dt_fim: null, dt_mandato_fim: "2027-01-31", id_captura: 1, dt_captura: "2026-10-21"}
          - {fonte: camara, id_exercicio: e4, id_pessoa: 8, id_cargo: deputado_federal, id_territorio: "35", id_candidatura: d22, id_partido: 5, base_partido: informado, dt_inicio: "2023-02-01", dt_fim: null, dt_mandato_fim: "2027-01-31", id_captura: 1, dt_captura: "2026-10-21"}
          - {fonte: camara, id_exercicio: e5, id_pessoa: 9, id_cargo: deputado_federal, id_territorio: "35", id_candidatura: null, id_partido: 5, base_partido: informado, dt_inicio: "2023-02-01", dt_fim: null, dt_mandato_fim: "2027-01-31", id_captura: 1, dt_captura: "2026-10-21"}
    expect:
