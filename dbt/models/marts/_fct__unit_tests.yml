        - {id_ocupacao: "mandato:s26", base_ocupacao: mandato, fonte: tse, id_pessoa: 5, id_candidatura: s26, id_exercicio: null, id_partido: 7, base_partido: informado, ano_inicio: 2027, dt_inicio: "2027-02-01", base_dt_inicio: derivado, dt_fim: "2035-01-31", base_dt_fim: previsto}
        - {id_ocupacao: "mandato:g22", base_ocupacao: mandato, fonte: tse, id_pessoa: 6, id_candidatura: g22, id_exercicio: null, id_partido: null, base_partido: null, ano_inicio: 2023, dt_inicio: "2023-01-01", base_dt_inicio: derivado, dt_fim: "2026-12-31", base_dt_fim: previsto}
