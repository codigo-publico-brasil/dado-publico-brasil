version: 2

# Consultas dos aplicativos (ADR 0030): views só de leitura sobre os fatos e o núcleo, sem regra de negócio. Cada uma é uma
# tabela larga que o aplicativo filtra pelo parâmetro (data, pessoa, votação, município).
models:
  - name: app_cargo_ocupantes
    description: Quem ocupa cada cargo, uma linha por período de ocupação; o aplicativo filtra a data (dt_inicio até dt_fim_prevista) e o cargo. Deputado federal e senador vêm do exercício publicado pela Câmara e pelo Senado (fim real, suplente que assumiu e eleito em eleição suplementar); quem foi eleito e ainda não assumiu e os demais cargos vêm do mandato da eleição, com o fim previsto pela duração do cargo (cassação e renúncia desses cargos não aparecem, issue 162). Sem data de posse, entra com dt_inicio vazio e ano_inicio preenchido.
    meta: {sensitivity: publico-agente-publico, grain: período de ocupação, owner: fundador do projeto, freshness: diário}
    columns:
      - {name: id_candidatura, description: "Candidatura eleita do mandato a que a ocupação pertence; vazia para o suplente que assumiu e para o eleito em eleição suplementar."}
      - {name: id_pessoa, description: "Pessoa do projeto."}
      - {name: nome, description: "Nome público da pessoa."}
      - {name: cargo, description: "Nome do cargo."}
      - {name: territorio, description: "Nome do território do mandato."}
      - {name: partido, description: "Sigla do partido pelo qual foi eleito."}
      - {name: ano_inicio, description: "Ano de início do mandato: o ano seguinte ao da eleição, como a Constituição e as eleições ordinárias determinam; sempre preenchido."}
      - {name: dt_inicio, description: "Dia do início do mandato; vazio quando o dia não está numa fonte nem numa regra (por exemplo, deputado estadual de 2026, que depende da constituição de cada estado)."}
      - {name: base_do_inicio, description: "Como o início foi obtido: derivado da Constituição ou informado pelo TSE."}
      - {name: dt_fim_prevista, description: "Fim da ocupação: o fim real do exercício quando a fonte o registra (base_do_fim informado) ou o fim previsto pela duração do mandato (derivado). Use esta coluna com dt_inicio para saber quem ocupa o cargo em uma data."}
      - {name: base_do_fim, description: "informado (a Câmara ou o Senado registra o fim do exercício) ou derivado (fim do mandato pela duração do cargo)."}
      - {name: base_eleicao, description: "Como se sabe que foi eleito: informado pelo TSE ou derivado dos votos."}
      - {name: dt_eleicao, description: "Dia da votação em que a pessoa foi eleita (último turno), como o TSE informa; vazio para quem assumiu como suplente sem ter sido eleito."}
      - {name: tipo_mandato, description: "novato (primeiro mandato no cargo e a base já cobria o ciclo anterior), reeleito (continuou do mandato anterior, um mandato atrás) ou retorno (já teve mandato, voltou depois de um intervalo); vazio quando não há prova. Abaixo do nível federal, compara o mesmo cargo na mesma unidade."}
      - {name: tipo_registro, description: "exercicio (período em que a Câmara ou o Senado registra a pessoa em exercício) ou mandato (período da eleição)."}
      - {name: fonte_url, description: "Arquivo oficial de onde saiu o registro (o do TSE para o mandato; o da Câmara ou do Senado para o exercício), na captura registrada."}
      - {name: dt_captura, description: "Data da captura desse arquivo."}

  - name: app_pessoa_eventos
    description: A ficha da pessoa com a linha do tempo, um evento por linha, com o nome do tipo, do cargo e do território e o endereço do arquivo original da fonte.
    meta: {sensitivity: publico-agente-publico, grain: evento da pessoa, owner: fundador do projeto, freshness: diário}
    columns:
      - {name: id_evento, description: "Identificador do evento."}
      - {name: id_pessoa, description: "Pessoa do evento."}
      - {name: ano_evento, description: "Ano do evento."}
      - {name: dt_evento, description: "Dia do evento, só quando a fonte dá o dia."}
      - {name: id_tipo_evento, description: "Tipo do evento, do catálogo."}
      - {name: evento, description: "Descrição do tipo do evento."}
      - {name: cargo, description: "Nome do cargo do evento, quando há."}
      - {name: territorio, description: "Nome do território do evento, quando há."}
      - {name: partido, description: "Sigla do partido do evento, quando há."}
      - {name: base, description: "Como o evento é obtido: informado pela fonte ou derivado de regra do projeto."}
      - {name: url_original, description: "Endereço do arquivo oficial de onde o evento veio; vazio quando o evento nasce de outra tabela do projeto."}

  - name: app_pessoa_campanhas
    description: Todas as candidaturas da pessoa, com foto, resultado e campanha, tenha ela vencido ou não. Só candidaturas de quem tem pessoa no projeto (quem já foi eleito).
    meta: {sensitivity: publico-agente-publico, grain: candidatura, owner: fundador do projeto, freshness: a cada eleição}
    columns:
      - {name: id_candidatura, description: "Identificador da candidatura."}
      - {name: id_pessoa, description: "Pessoa do projeto."}
      - {name: ano_eleicao, description: "Ano da eleição."}
      - {name: cargo, description: "Nome do cargo disputado; vazio quando a candidatura não tem disputa."}
      - {name: dt_eleicao, description: "Dia da votação do último turno que a candidatura disputou, como o TSE informa."}
      - {name: numero, description: "Número do candidato na urna."}
      - {name: partido, description: "Sigla do partido da candidatura."}
      - {name: resultado, description: "Resultado do último turno como o TSE informa; vazio quando não informa."}
      - {name: fl_eleito, description: "Verdadeiro quando a candidatura foi eleita: o TSE marca como eleita ou, sem essa informação, vence no último turno pelos votos válidos (base_eleito diz qual)."}
      - {name: base_eleito, description: "Base de fl_eleito verdadeiro: informado (o TSE diz Eleito) ou derivado (regra da Constituição, pelos votos do último turno); vazio quando a candidatura não foi eleita."}
      - {name: foto_caminho, description: "Caminho da foto oficial; vazio sem foto."}
      - {name: valor_receitas, description: "Soma das receitas declaradas, em reais; vazia sem prestação de contas carregada."}
      - {name: valor_despesas, description: "Soma das despesas contratadas declaradas, em reais."}
      - {name: valor_bens, description: "Soma dos bens declarados, em reais."}
      - {name: fonte_url, description: "Arquivo oficial do TSE de onde saíram a candidatura e o resultado, na captura registrada."}
      - {name: dt_captura, description: "Data da captura desse arquivo."}
      - {name: fonte_url_receitas, description: "Arquivo oficial do TSE das receitas da campanha; vazio sem prestação de contas carregada."}
      - {name: fonte_url_despesas, description: "Arquivo oficial do TSE das despesas da campanha; vazio sem prestação de contas carregada."}
      - {name: fonte_url_bens, description: "Arquivo oficial do TSE dos bens declarados; vazio quando o arquivo da eleição não foi carregado."}
      - {name: dt_captura_campanha, description: "Data da captura mais recente entre os arquivos de receitas, despesas e bens."}

  - name: app_decisao
    description: Uma linha por votação e proposição, com o resultado e os totais, para consumo pelas aplicações.
    meta: {sensitivity: publico, grain: votação e proposição, owner: fundador do projeto, freshness: diário}
    columns:
      - {name: fonte, description: "Fonte da votação (camara ou senado)."}
      - {name: id_votacao, description: "Identificador da votação na fonte."}
      - {name: dt_votacao, description: "Data da votação."}
      - {name: papel, description: "Papel da proposição na votação: afetada, objeto ou materia."}
      - {name: proposicao, description: "Sigla da proposição; vazia quando ela não está carregada."}
      - {name: ementa, description: "Ementa da proposição; vazia quando ela não está carregada."}
      - {name: url_proposicao, description: "Endereço da proposição na fonte."}
      - {name: descricao, description: "Descrição da votação como a fonte informa."}
      - {name: aprovada, description: "Resultado da votação segundo a fonte."}
      - {name: votos_sim, description: "Votos sim."}
      - {name: votos_nao, description: "Votos não."}
      - {name: votos_outros, description: "Demais votos (abstenção, obstrução)."}

  - name: app_decisao_partidos
    description: O voto por partido em cada votação, com o partido como chave (id_partido) e a sigla do voto ao lado, para a página Quem Decidiu.
    meta: {sensitivity: publico, grain: votação, partido e voto, owner: fundador do projeto, freshness: diário}
    columns:
      - {name: fonte, description: "Fonte da votação."}
      - {name: id_votacao, description: "Identificador da votação."}
      - {name: id_partido, description: "Partido (dim_partidos) na data do voto; vazio para voto sem partido ou sigla não curada."}
      - {name: partido, description: "Sigla atual do partido; sem id_partido, a sigla do voto."}
      - {name: partido_no_voto, description: "Sigla do partido na data do voto, como a fonte informa."}
      - {name: voto, description: "Voto registrado."}
      - {name: qtd_votos, description: "Quantos votos."}

  - name: app_composicao_comparada
    description: A composição por corte, tipo, cargo, território e partido, com nomes legíveis; o aplicativo escolhe dois cortes e compara. A eleita e a em exercício aparecem separadas.
    meta: {sensitivity: publico, grain: corte, tipo, cargo, território e partido, owner: fundador do projeto, freshness: diário}
    columns:
      - {name: dt_corte, description: "Data do corte: 1º de janeiro ou 1º de julho."}
      - {name: tipo_composicao, description: "eleita ou exercicio."}
      - {name: cargo, description: "Nome do cargo."}
      - {name: territorio, description: "Nome do território; vazio onde a fonte não liga a um território."}
      - {name: partido, description: "Sigla do partido; vazia quando não se conhece."}
      - {name: cadeiras, description: "Quantas pessoas ocupam o cargo naquele corte, território e partido."}

  - name: app_municipio_governo
    description: Prefeito, vice e vereadores eleitos de cada município por eleição, com partido.
    meta: {sensitivity: publico-agente-publico, grain: mandato municipal, owner: fundador do projeto, freshness: a cada eleição}
    columns:
      - {name: id_territorio, description: "Município (dim_territorios)."}
      - {name: municipio, description: "Nome do município."}
      - {name: ano_eleicao, description: "Ano da eleição."}
      - {name: cargo, description: "Nome do cargo."}
      - {name: nome, description: "Nome público da pessoa; vazio quando o eleito não tem pessoa."}
      - {name: partido, description: "Sigla do partido pelo qual foi eleito."}
      - {name: id_pessoa, description: "Pessoa do projeto."}

  - name: app_pessoas
    description: A ficha cadastral de cada pessoa do projeto (quem já foi eleito), com a foto. O cadastro de contato, escolaridade e profissões só existe para quem passou pela Câmara ou pelo Senado e fica vazio para os demais.
    meta: {sensitivity: publico-agente-publico, grain: pessoa, owner: fundador do projeto, freshness: diário}
    columns:
      - {name: id_pessoa, description: "Pessoa do projeto.", tests: [unique, not_null]}
      - {name: nome, description: "Nome pelo qual a pessoa é conhecida."}
      - {name: nome_civil, description: "Nome civil, como a fonte informa."}
      - {name: nome_social, description: "Nome social declarado na candidatura mais recente do TSE que o informa; vazio para quase todos (poucos declaram)."}
      - {name: genero, description: "Masculino ou feminino, só quando a fonte diz."}
      - {name: dt_nascimento, description: "Data de nascimento informada pela fonte."}
      - {name: dt_falecimento, description: "Data de falecimento informada pela fonte."}
      - {name: municipio_nascimento, description: "Município de nascimento informado pela fonte."}
      - {name: uf_nascimento, description: "UF de nascimento: a do cadastro da Câmara ou do Senado quando existe; senão, a declarada na candidatura mais recente do TSE (ZZ para nascido no exterior)."}
      - {name: escolaridade, description: "Escolaridade: a do cadastro da Câmara quando existe; senão, o grau de instrução declarado na candidatura mais recente do TSE que o informa (Não divulgável quando o TSE protege o dado)."}
      - {name: estado_civil, description: "Estado civil declarado na candidatura mais recente do TSE que o informa; vazio quando nenhuma informa (Não divulgável quando o TSE protege o dado)."}
      - {name: profissoes, description: "Profissões: as do cadastro da Câmara (separadas por ponto e vírgula) quando existem; senão, a ocupação declarada na candidatura mais recente do TSE que a informa."}
      - {name: situacao_atual, description: "Situação no último status da Câmara (por exemplo, Exercício ou Licença); vazia onde a fonte não informa."}
      - {name: email_institucional, description: "E-mail institucional do gabinete, como a Câmara ou o Senado publica."}
      - {name: telefone_institucional, description: "Telefone institucional do gabinete."}
      - {name: gabinete_endereco, description: "Endereço do gabinete."}
      - {name: pagina_url, description: "Página oficial da pessoa no Senado; vazia onde a fonte não informa."}
      - {name: site_url, description: "Site informado no cadastro."}
      - {name: rede_social_url, description: "Primeira rede social informada no cadastro."}
      - {name: foto_caminho, description: "Foto oficial do TSE da candidatura mais recente (caminho do arquivo local); vazia sem foto."}
      - {name: foto_url, description: "Endereço da foto oficial da Câmara ou do Senado; vazio onde a fonte não informa."}
      - {name: fontes, description: "Fontes em que a pessoa aparece no cadastro (por exemplo, camara, senado); vazio para quem só tem o TSE."}
      - {name: fonte_url, description: "Arquivo oficial de onde saem os dados da ficha: o cadastro da Câmara ou do Senado quando a pessoa tem, senão o arquivo de candidaturas do TSE, na captura registrada."}
      - {name: dt_captura, description: "Data da captura desse arquivo."}

  - name: app_pessoa_votos
    description: O voto de cada pessoa em cada votação nominal da Câmara e do Senado, com a data, a descrição e o resultado da votação como a fonte publica. Uma linha por pessoa e votação; as proposições votadas estão em app_decisao.
    meta: {sensitivity: publico-agente-publico, grain: pessoa e votação, owner: fundador do projeto, freshness: diário}
    columns:
      - {name: fonte, description: "Fonte da votação (camara ou senado)."}
      - {name: id_votacao, description: "Identificador da votação na fonte."}
      - {name: id_pessoa, description: "Pessoa que votou."}
      - {name: voto, description: "Voto registrado, como a fonte informa (sim, não, abstenção, obstrução...)."}
      - {name: dt_voto, description: "Data e hora do voto, como a fonte informa."}
      - {name: partido, description: "Sigla do partido do parlamentar no voto, do cadastro de partidos; vazia quando a sigla da fonte não casa."}
      - {name: partido_na_fonte, description: "Sigla do partido como a fonte informa no voto."}
      - {name: uf, description: "UF do parlamentar no voto, como a fonte informa."}
      - {name: dt_votacao, description: "Data da votação."}
      - {name: descricao, description: "Descrição da votação como a fonte informa."}
      - {name: aprovada, description: "Resultado da votação segundo a fonte."}

  - name: app_pessoa_partidos
    description: Os partidos da pessoa ao longo do tempo, de fontes oficiais (histórico da Câmara, votos, início da legislatura e candidaturas do TSE), com a base de cada período. Uma linha por pessoa e período. Não afirma a data de filiação; o partido da candidatura é o da eleição.
    meta: {sensitivity: publico-agente-publico, grain: pessoa e período, owner: fundador do projeto, freshness: diário}
    columns:
      - {name: id_pessoa_partido, description: "Identificador da linha: fonte e registro de origem."}
      - {name: id_pessoa, description: "Pessoa do projeto."}
      - {name: partido, description: "Sigla do partido, do cadastro de partidos; vazia quando a sigla da fonte não casa."}
      - {name: partido_na_fonte, description: "Sigla do partido como a fonte informa."}
      - {name: ano_referencia, description: "Ano do momento: o do primeiro registro da Câmara ou o da eleição da candidatura."}
      - {name: dt_inicio, description: "Data do primeiro registro com este partido, quando a fonte dá o dia."}
      - {name: dt_ultimo_registro, description: "Só na Câmara: data do último registro com este partido; não é o fim da filiação."}
      - {name: base, description: "De onde sai o partido: historico_de_deputados, inicio_da_legislatura, votos ou candidatura."}
      - {name: fl_mais_recente, description: "Verdadeiro na linha mais recente da pessoa; não é necessariamente o partido de hoje."}
