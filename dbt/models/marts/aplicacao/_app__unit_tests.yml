version: 2

unit_tests:
  - name: campanha_do_vencedor_derivado_sai_eleita_com_a_base_e_o_resultado_do_tse_intacto
    description: >
      O TSE não informa o resultado do 2º turno de 2006; o vencedor vem da regra da Constituição (int_tse_eleitos).
      A candidatura derivada sai eleita com base derivada e `resultado` vazio; a informada, com base informada; a
      outra, sem eleição, fica sem base e sem marca de eleita.
    model: app_pessoa_campanhas
    given:
      - input: ref('fct_candidaturas')
        rows:
          - {id_candidatura: "2006:BR:1", id_pessoa: 1, id_disputa: d, resultado: null, fl_eleito: null}
          - {id_candidatura: "2022:BR:1", id_pessoa: 1, id_disputa: d, resultado: Eleito, fl_eleito: true}
          - {id_candidatura: "2022:BR:2", id_pessoa: 2, id_disputa: d, resultado: Não eleito, fl_eleito: false}
      - input: ref('stg_tse__candidaturas')
        rows:
          - {id_candidatura: "2006:BR:1", ano_eleicao: 2006}
          - {id_candidatura: "2022:BR:1", ano_eleicao: 2022}
          - {id_candidatura: "2022:BR:2", ano_eleicao: 2022}
      - input: ref('int_tse_eleitos')
        rows:
          - {id_candidatura: "2006:BR:1", base_eleicao: derivado}
          - {id_candidatura: "2022:BR:1", base_eleicao: informado}
      - input: ref('dim_disputas')
        rows: []
      - input: ref('dim_cargos')
        rows: []
      - input: ref('fct_campanhas')
        rows: []
      - input: ref('dim_partidos')
        rows: []
      - input: ref('stg_metadata__captures')
        rows: []
    expect:
      rows:
        - {id_candidatura: "2006:BR:1", resultado: null, fl_eleito: true, base_eleito: derivado}
        - {id_candidatura: "2022:BR:1", resultado: Eleito, fl_eleito: true, base_eleito: informado}
        - {id_candidatura: "2022:BR:2", resultado: Não eleito, fl_eleito: false, base_eleito: null}

  - name: tipo_do_mandato_compara_com_o_mandato_anterior_da_mesma_pessoa_no_mesmo_cargo_e_unidade
    description: >
      Reeleito é o mandato de um ciclo atrás; retorno, o de um intervalo; novato, o primeiro quando a base já cobria o
      ciclo anterior; sem essa prova o campo fica vazio. Abaixo do nível federal a unidade conta: o vereador que muda de
      município começa de novo. O ano de início é o ano seguinte ao da eleição, mesmo sem a data de posse.
    model: app_cargo_ocupantes
    given:
      - input: ref('fct_mandatos')
        rows:
          - {id_candidatura: a14, id_pessoa: 1, id_eleicao: "2014-1", id_cargo: deputado_federal, id_captura: 1}
          - {id_candidatura: a18, id_pessoa: 1, id_eleicao: "2018-1", id_cargo: deputado_federal, id_captura: 1}
          - {id_candidatura: a26, id_pessoa: 1, id_eleicao: "2026-1", id_cargo: deputado_federal, id_captura: 1}
          - {id_candidatura: b22, id_pessoa: 2, id_eleicao: "2022-1", id_cargo: deputado_federal, id_captura: 1}
          - {id_candidatura: c20, id_pessoa: 3, id_eleicao: "2020-1", id_cargo: vereador, id_territorio: A, id_captura: 1}
          - {id_candidatura: c24, id_pessoa: 3, id_eleicao: "2024-1", id_cargo: vereador, id_territorio: B, id_captura: 1}
          - {id_candidatura: d20, id_pessoa: 4, id_eleicao: "2020-1", id_cargo: vereador, id_territorio: A, id_captura: 1}
      - input: ref('dim_cargos')
        rows:
          - {id_cargo: deputado_federal, nome: Deputado federal, duracao_anos: 4, esfera: federal}
          - {id_cargo: vereador, nome: Vereador, duracao_anos: 4, esfera: municipal}
      - input: ref('dim_pessoas')
        rows:
          - {id_pessoa: 1, nome_publico: Um}
          - {id_pessoa: 2, nome_publico: Dois}
          - {id_pessoa: 3, nome_publico: Tres}
          - {id_pessoa: 4, nome_publico: Quatro}
      - input: ref('dim_territorios')
        rows: []
      - input: ref('dim_partidos')
        rows: []
      - input: ref('stg_metadata__captures')
        rows:
          - {id_captura: 1, url: "https://exemplo.gov.br/arquivo.zip", dt_captura: "2026-10-21 10:00:00"}
    expect:
      rows:
        - {id_candidatura: a14, ano_inicio: 2015, tipo_mandato: null, fonte_url: "https://exemplo.gov.br/arquivo.zip"}
        - {id_candidatura: a18, ano_inicio: 2019, tipo_mandato: reeleito, fonte_url: "https://exemplo.gov.br/arquivo.zip"}
        - {id_candidatura: a26, ano_inicio: 2027, tipo_mandato: retorno, fonte_url: "https://exemplo.gov.br/arquivo.zip"}
        - {id_candidatura: b22, ano_inicio: 2023, tipo_mandato: novato, fonte_url: "https://exemplo.gov.br/arquivo.zip"}
        - {id_candidatura: c20, ano_inicio: 2021, tipo_mandato: null, fonte_url: "https://exemplo.gov.br/arquivo.zip"}
        - {id_candidatura: c24, ano_inicio: 2025, tipo_mandato: novato, fonte_url: "https://exemplo.gov.br/arquivo.zip"}
        - {id_candidatura: d20, ano_inicio: 2021, tipo_mandato: null, fonte_url: "https://exemplo.gov.br/arquivo.zip"}
