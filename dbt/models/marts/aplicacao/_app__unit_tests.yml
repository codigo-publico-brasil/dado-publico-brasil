version: 2

unit_tests:
  - name: campanha_so_junta_os_marts_e_marca_o_vencedor_derivado_com_o_resultado_do_tse_intacto
    description: >
      O TSE não informa o resultado do 2º turno de 2006; o vencedor vem da regra da Constituição, que fct_candidaturas já
      traz em base_eleicao. A candidatura derivada sai eleita com base derivada e `resultado` vazio; a informada, com base
      informada; a outra, sem eleição, fica sem base e sem marca de eleita. O ano vem de dim_eleicoes, os valores de
      fct_campanhas e o endereço das capturas de metadata.capturas.
    model: app_pessoa_campanhas
    given:
      - input: ref('fct_candidaturas')
        rows:
          - {id_candidatura: "2006:BR:1", id_pessoa: 1, id_eleicao: "2006-1", id_disputa: d, id_partido: 7, id_captura: 1, resultado: null, fl_eleito: null, base_eleicao: derivado}
          - {id_candidatura: "2022:BR:1", id_pessoa: 1, id_eleicao: "2022-1", id_disputa: d, id_captura: 1, resultado: Eleito, fl_eleito: true, base_eleicao: informado}
          - {id_candidatura: "2022:BR:2", id_pessoa: 2, id_eleicao: "2022-1", id_disputa: d, id_captura: 1, resultado: Não eleito, fl_eleito: false, base_eleicao: null}
      - input: ref('dim_eleicoes')
        rows:
          - {id_eleicao: "2006-1", ano_eleicao: 2006}
          - {id_eleicao: "2022-1", ano_eleicao: 2022}
      - input: ref('dim_disputas')
        rows:
          - {id_disputa: d, id_cargo: presidente}
      - input: ref('dim_cargos')
        rows:
          - {id_cargo: presidente, nome: Presidente}
      - input: ref('fct_campanhas')
        rows:
          - {id_candidatura: "2022:BR:1", valor_receitas: 10, valor_despesas: 5, valor_bens: 3, id_captura_receitas: 2, id_captura_despesas: 3, id_captura_bens: null}
      - input: ref('dim_partidos')
        rows:
          - {id_partido: 7, sigla: AAA}
      - input: source('metadata', 'capturas')
        rows:
          - {id_captura: 1, url: "https://exemplo.gov.br/candidaturas.zip", dt_captura: "2026-10-21 10:00:00"}
          - {id_captura: 2, url: "https://exemplo.gov.br/receitas.zip", dt_captura: "2026-10-22 10:00:00"}
          - {id_captura: 3, url: "https://exemplo.gov.br/despesas.zip", dt_captura: "2026-10-23 10:00:00"}
    expect:
      rows:
        - {id_candidatura: "2006:BR:1", ano_eleicao: 2006, cargo: Presidente, partido: AAA, resultado: null, fl_eleito: true, base_eleito: derivado, valor_receitas: null, valor_despesas: null, valor_bens: null, fonte_url: "https://exemplo.gov.br/candidaturas.zip", dt_captura: "2026-10-21", fonte_url_receitas: null, fonte_url_despesas: null, fonte_url_bens: null, dt_captura_campanha: null}
        - {id_candidatura: "2022:BR:1", ano_eleicao: 2022, cargo: Presidente, partido: null, resultado: Eleito, fl_eleito: true, base_eleito: informado, valor_receitas: 10, valor_despesas: 5, valor_bens: 3, fonte_url: "https://exemplo.gov.br/candidaturas.zip", dt_captura: "2026-10-21", fonte_url_receitas: "https://exemplo.gov.br/receitas.zip", fonte_url_despesas: "https://exemplo.gov.br/despesas.zip", fonte_url_bens: null, dt_captura_campanha: "2026-10-23"}
        - {id_candidatura: "2022:BR:2", ano_eleicao: 2022, cargo: Presidente, partido: null, resultado: Não eleito, fl_eleito: false, base_eleito: null, valor_receitas: null, valor_despesas: null, valor_bens: null, fonte_url: "https://exemplo.gov.br/candidaturas.zip", dt_captura: "2026-10-21", fonte_url_receitas: null, fonte_url_despesas: null, fonte_url_bens: null, dt_captura_campanha: null}

  - name: ocupante_so_junta_nomes_e_traduz_a_base_do_fim_da_ocupacao
    description: >
      A consulta não tem regra: traz da ocupação (fct_cargos_ocupacoes) os nomes do cargo, do território e do partido, o
      tipo do mandato e a base da eleição (fct_mandatos), o dia da eleição (fct_candidaturas) e o endereço oficial da
      captura. O fim previsto da ocupação sai como derivado, o contrato antigo; o exercício sem candidatura fica sem tipo.
    model: app_cargo_ocupantes
    given:
      - input: ref('fct_cargos_ocupacoes')
        rows:
          - {id_ocupacao: "exercicio:e1", base_ocupacao: exercicio, id_candidatura: m1, id_pessoa: 1, id_cargo: senador, id_territorio: "35", id_partido: 7, ano_inicio: 2019, dt_inicio: "2019-02-01", base_dt_inicio: informado, dt_fim: "2019-12-20", base_dt_fim: informado, id_captura: 1, dt_captura: "2026-10-21"}
          - {id_ocupacao: "exercicio:e2", base_ocupacao: exercicio, id_candidatura: null, id_pessoa: 2, id_cargo: senador, id_territorio: "35", id_partido: null, ano_inicio: 2020, dt_inicio: "2020-03-01", base_dt_inicio: informado, dt_fim: "2027-01-31", base_dt_fim: previsto, id_captura: 1, dt_captura: "2026-10-21"}
          - {id_ocupacao: "mandato:m3", base_ocupacao: mandato, id_candidatura: m3, id_pessoa: 3, id_cargo: senador, id_territorio: "35", id_partido: 7, ano_inicio: 2027, dt_inicio: null, base_dt_inicio: null, dt_fim: null, base_dt_fim: null, id_captura: 1, dt_captura: "2026-10-21"}
      - input: ref('fct_mandatos')
        rows:
          - {id_candidatura: m1, base_eleicao: informado, tipo_mandato: reeleito}
          - {id_candidatura: m3, base_eleicao: derivado, tipo_mandato: null}
      - input: ref('fct_candidaturas')
        rows:
          - {id_candidatura: m1, dt_eleicao: "2018-10-07"}
          - {id_candidatura: m3, dt_eleicao: "2026-10-04"}
      - input: ref('dim_pessoas')
        rows:
          - {id_pessoa: 1, nome_publico: Um}
          - {id_pessoa: 2, nome_publico: Dois}
          - {id_pessoa: 3, nome_publico: Tres}
      - input: ref('dim_cargos')
        rows:
          - {id_cargo: senador, nome: Senador}
      - input: ref('dim_territorios')
        rows:
          - {id_territorio: "35", nome: Sao Paulo}
      - input: ref('dim_partidos')
        rows:
          - {id_partido: 7, sigla: AAA}
      - input: source('metadata', 'capturas')
        rows:
          - {id_captura: 1, url: "https://exemplo.gov.br/arquivo.zip", dt_captura: "2026-10-21 10:00:00"}
    expect:
      rows:
        - {id_pessoa: 1, id_candidatura: m1, nome: Um, cargo: Senador, territorio: Sao Paulo, partido: AAA, ano_inicio: 2019, dt_inicio: "2019-02-01", base_do_inicio: informado, dt_fim_prevista: "2019-12-20", base_do_fim: informado, base_eleicao: informado, dt_eleicao: "2018-10-07", tipo_mandato: reeleito, tipo_registro: exercicio, fonte_url: "https://exemplo.gov.br/arquivo.zip", dt_captura: "2026-10-21"}
        - {id_pessoa: 2, id_candidatura: null, nome: Dois, cargo: Senador, territorio: Sao Paulo, partido: null, ano_inicio: 2020, dt_inicio: "2020-03-01", base_do_inicio: informado, dt_fim_prevista: "2027-01-31", base_do_fim: derivado, base_eleicao: null, dt_eleicao: null, tipo_mandato: null, tipo_registro: exercicio, fonte_url: "https://exemplo.gov.br/arquivo.zip", dt_captura: "2026-10-21"}
        - {id_pessoa: 3, id_candidatura: m3, nome: Tres, cargo: Senador, territorio: Sao Paulo, partido: AAA, ano_inicio: 2027, dt_inicio: null, base_do_inicio: null, dt_fim_prevista: null, base_do_fim: derivado, base_eleicao: derivado, dt_eleicao: "2026-10-04", tipo_mandato: null, tipo_registro: mandato, fonte_url: "https://exemplo.gov.br/arquivo.zip", dt_captura: "2026-10-21"}

  - name: ficha_do_cadastro_vale_primeiro_e_o_tse_completa_com_a_candidatura_mais_recente_que_informa
    description: >
      A pessoa que passou pela Câmara ou pelo Senado traz o cadastro; o que ele não informa vem do valor da candidatura
      mais recente do TSE que o informa (não da mais recente em geral), com a fonte de cada atributo. Quem só tem o TSE
      fica com a base tse; o que ninguém informa fica vazio.
    model: app_pessoas
    given:
      - input: ref('dim_pessoas')
        rows:
          - {id_pessoa: 1, nome_publico: Um, nome_civil: Um Civil, genero: masculino, dt_nascimento: "1970-01-01", uf_nascimento: SP, fonte_uf_nascimento: camara, escolaridade: Superior, fonte_escolaridade: camara, profissoes: Advogado, fonte_profissoes: camara, estado_civil: Casado, nome_social: null, foto_caminho: "fotos/2022/SP/1.jpg", id_captura_tse: 5, dt_captura_tse: "2026-10-05"}
          - {id_pessoa: 2, nome_publico: Dois, uf_nascimento: MG, fonte_uf_nascimento: tse, escolaridade: Médio, fonte_escolaridade: tse, profissoes: Professor, fonte_profissoes: tse, id_captura_tse: 5, dt_captura_tse: "2026-10-05"}
          - {id_pessoa: 3, nome_publico: Tres}
      - input: ref('dim_pessoas_cadastro')
        rows:
          - {id_pessoa: 1, fonte: camara, fontes: "camara, senado", foto_url: "https://exemplo.gov.br/1.jpg", id_captura: 4, dt_captura: "2026-10-04"}
      - input: source('metadata', 'capturas')
        rows:
          - {id_captura: 4, fonte: camara, dataset: deputados, url: "https://exemplo.gov.br/deputados.json", dt_captura: "2026-10-04 10:00:00"}
          - {id_captura: 5, fonte: tse, dataset: candidaturas, url: "https://exemplo.gov.br/candidaturas.zip", dt_captura: "2026-10-05 10:00:00"}
    expect:
      rows:
        - {id_pessoa: 1, nome: Um, uf_nascimento: SP, escolaridade: Superior, profissoes: Advogado, estado_civil: Casado, foto_caminho: "fotos/2022/SP/1.jpg", foto_url: "https://exemplo.gov.br/1.jpg", fontes: "camara, senado", fonte_url: "https://exemplo.gov.br/deputados.json", dt_captura: "2026-10-04"}
        - {id_pessoa: 2, nome: Dois, uf_nascimento: MG, escolaridade: Médio, profissoes: Professor, estado_civil: null, foto_caminho: null, foto_url: null, fontes: null, fonte_url: "https://exemplo.gov.br/candidaturas.zip", dt_captura: "2026-10-05"}
        - {id_pessoa: 3, nome: Tres, uf_nascimento: null, escolaridade: null, profissoes: null, estado_civil: null, foto_caminho: null, foto_url: null, fontes: null, fonte_url: null, dt_captura: null}
