version: 2

sources:
  - name: transparencia
    description: >
      Portal da Transparência do Governo Federal (CGU), emendas parlamentares (pacote .zip nacional com três tabelas).
      Carregado em raw_federal_transparencia (declaração em sources/executivo/federal/transparencia.yml): favorecido
      pessoa física entra como a fonte publica (marcado como dado pessoal). Licença pela política de dados abertos (Decreto 8.777/2016); as páginas de termos do portal pedem verificação anti-robô e não foram lidas.
    schema: raw_federal_transparencia
    loaded_at_field: to_timestamp(cast(_dlt_load_id as double))
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 60, period: day}
    meta:
      origin: Controladoria-Geral da União (Portal da Transparência)
      sensitivity: publico-dados-pessoais-de-terceiros
      owner: fundador do projeto
    tables:
      - name: emendas
        description: Emendas parlamentares por localidade, função, programa e ação, com os valores empenhado, liquidado e pago.
      - name: emendas_convenios
        description: Convênios firmados com recursos de emendas parlamentares.
      - name: emendas_favorecidos
        description: Quem recebeu o dinheiro das emendas, como a fonte publica (inclui pessoa física, com CPF mascarado).
