      - {name: numero_termo_aditivo, description: "Número do termo aditivo.", tests: ["not_null"]}
      - {name: dt_publicacao, description: "Data de publicação do termo aditivo."}
      - {name: objeto, description: "Objeto do termo aditivo, texto livre da fonte (CPF no texto é mascarado (***.nnn.nnn-**) pelo projeto)."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}
