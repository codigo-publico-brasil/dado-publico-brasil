      - {name: modalidade_despesa, description: "Modalidade de aplicação da despesa."}
      - {name: valor_empenhado, description: "Valor empenhado no mês, em reais."}
      - {name: valor_liquidado, description: "Valor liquidado no mês, em reais."}
      - {name: valor_pago, description: "Valor pago no mês, em reais."}
      - {name: valor_restos_a_pagar_inscritos, description: "Restos a pagar inscritos, em reais."}
      - {name: valor_restos_a_pagar_cancelados, description: "Restos a pagar cancelados, em reais."}
      - {name: valor_restos_a_pagar_pagos, description: "Restos a pagar pagos, em reais."}
