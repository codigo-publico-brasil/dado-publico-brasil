      - {name: sha256_captura, description: "Impressão digital (SHA-256) do arquivo de origem: prova de que é o que a fonte entregou."}
  - name: stg_transparencia__emendas_favorecidos
    description: Quem recebeu o dinheiro de cada emenda, por mês, como a fonte publica (inclui pessoa física, com CPF mascarado).
    columns:
      - {name: cd_emenda, description: "Identificador da emenda, de 12 dígitos: 4 do ano da emenda, 4 do código do autor e 4 do número da emenda do autor (dicionário de dados do portal); vazio em registros antigos sem código."}
      - {name: cd_autor, description: "Código do autor da emenda como registrado no SIAFI (não é o código do parlamentar); vazio quando a fonte não informa."}
      - {name: autor_nome, description: "Nome do autor da emenda como registrado no SIAFI (parlamentar, bancada, comissão ou relator-geral), com caixa padronizada."}
      - {name: numero, description: "Número da norma."}
      - {name: tipo, description: "Mudança de nome, fusão ou incorporação."}
      - {name: ano, description: "Ano do evento."}
      - {name: mes, description: "Mês do pagamento."}
      - {name: cd_favorecido, description: "CNPJ, código da unidade gestora ou CPF mascarado do favorecido. A fonte já mascara o CPF; quando vem com 11 dígitos, o projeto mascara (***.nnn.nnn-**); o original fica no landing."}
      - {name: favorecido, description: "Nome do favorecido (pessoa física inclusive). Número de CPF de 11 dígitos no texto é mascarado (***.nnn.nnn-**) pelo projeto; o original fica no landing."}
      - {name: natureza_juridica, description: "Natureza jurídica do favorecido."}
      - {name: tipo_favorecido, description: "Tipo do favorecido como a fonte informa: Pessoa Jurídica, Pessoa Fisica, Unidade Gestora, Inscrição Genérica, Sem informação ou Inválido (o dicionário do portal cita só pessoa física e jurídica; em parte das linhas a fonte grafa Inscrição Genéric, truncado)."}
      - {name: uf, description: "UF de eleição ou representação nos votos da legislatura."}
      - {name: municipio, description: "Município de aplicação."}
      - {name: valor, description: "Valor declarado em reais, sem correção."}
      - {name: fonte, description: "Fonte oficial do registro (camara, senado, tse...), igual ao prefixo do modelo."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}
      - {name: dt_captura, description: "Instante (UTC) em que o arquivo de origem foi capturado pela primeira vez (metadata.capturas)."}
      - {name: url_fonte, description: "Endereço oficial de onde o arquivo de origem foi baixado."}
      - {name: sha256_captura, description: "Impressão digital (SHA-256) do arquivo de origem: prova de que é o que a fonte entregou."}
  - name: stg_transparencia__despesas
    description: Execução da despesa federal por mês, órgão, unidade gestora, ação e natureza da despesa, com os valores empenhado, liquidado e pago. Não traz favorecido (o arquivo não o publica).
    columns:
      - {name: dt_lancamento, description: "Mês do lançamento da despesa (primeiro dia do mês; a fonte traz AAAA/MM).", tests: ["not_null"]}
      - {name: cd_orgao_superior, description: "Código SIAFI do órgão superior (ministério ou equivalente), como a fonte informa."}
      - {name: orgao_superior, description: "Nome do órgão superior (ministério ou equivalente)."}
      - {name: cd_orgao_subordinado, description: "Código SIAFI do órgão subordinado, como a fonte informa."}
      - {name: orgao_subordinado, description: "Nome do órgão subordinado."}
      - {name: cd_unidade_gestora, description: "Código SIAFI da unidade gestora que executou a despesa.", tests: ["not_null"]}
      - {name: unidade_gestora, description: "Nome da unidade gestora."}
      - {name: cd_gestao, description: "Código da gestão no SIAFI."}
      - {name: gestao, description: "Nome da gestão no SIAFI."}
      - {name: cd_unidade_orcamentaria, description: "Código da unidade orçamentária."}
      - {name: unidade_orcamentaria, description: "Nome da unidade orçamentária."}
      - {name: cd_funcao, description: "Código da função orçamentária."}
      - {name: funcao, description: "Função orçamentária."}
      - {name: cd_subfuncao, description: "Código da subfunção orçamentária (a coluna da fonte se chama `Código Subfução`, com o erro de grafia)."}
      - {name: subfuncao, description: "Subfunção orçamentária."}
      - {name: cd_programa_orcamentario, description: "Código do programa orçamentário."}
      - {name: programa_orcamentario, description: "Programa orçamentário."}
      - {name: cd_acao, description: "Código da ação orçamentária."}
      - {name: acao, description: "Ação orçamentária."}
      - {name: cd_plano_orcamentario, description: "Código do plano orçamentário."}
      - {name: plano_orcamentario, description: "Plano orçamentário."}
      - {name: cd_programa_governo, description: "Código do programa de governo."}
      - {name: programa_governo, description: "Programa de governo."}
      - {name: uf, description: "UF onde a despesa foi aplicada, como a fonte informa; vazia quando não se aplica."}
      - {name: municipio, description: "Município de aplicação da despesa; vazio quando não se aplica."}
      - {name: cd_subtitulo, description: "Código do subtítulo (localizador do gasto) orçamentário."}
      - {name: subtitulo, description: "Subtítulo orçamentário."}
      - {name: cd_localizador, description: "Código do localizador do gasto."}
      - {name: localizador, description: "Localizador do gasto."}
      - {name: sigla_localizador, description: "Sigla do localizador do gasto, como a fonte informa (`-1` quando não se aplica)."}
      - {name: localizador_descricao, description: "Descrição complementar do localizador do gasto."}
      - {name: cd_autor_emenda, description: "Código do autor da emenda como registrado no SIAFI (não é o código do parlamentar); vazio sem emenda."}
      - {name: autor_emenda, description: "Nome do autor da emenda como registrado no SIAFI (parlamentar, bancada ou comissão), como a fonte publica; `SEM EMENDA` quando a despesa não vem de emenda."}
      - {name: cd_categoria_economica, description: "Código da categoria econômica da despesa."}
