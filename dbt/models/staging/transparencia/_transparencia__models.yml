      - {name: fonte, description: "Fonte oficial do registro (camara, senado, tse...), igual ao prefixo do modelo."}
      - {name: dt_captura, description: "Instante (UTC) em que o arquivo de origem foi capturado pela primeira vez (metadata.capturas)."}
      - {name: url_fonte, description: "Endereço oficial de onde o arquivo de origem foi baixado."}
      - {name: sha256_captura, description: "Impressão digital (SHA-256) do arquivo de origem: prova de que é o que a fonte entregou."}
  - name: stg_transparencia__compras
    description: "Contratos do governo federal, um por linha, de 2022-11 em diante. Contratado pessoa física vem com CPF completo na fonte e sai mascarado aqui."
    meta: {sensitivity: publico-dados-pessoais-de-terceiros}
    columns:
      - {name: numero_contrato, description: "Número do contrato, como a fonte informa (único só junto com a unidade gestora).", tests: ["not_null"]}
      - {name: objeto, description: "Objeto do contrato, texto livre da fonte (CPF no texto é mascarado (***.nnn.nnn-**) pelo projeto; o original fica no landing). Pode ser `Informação protegida por sigilo`."}
      - {name: fundamento_legal, description: "Fundamento legal da contratação."}
      - {name: modalidade_compra, description: "Modalidade da compra (pregão, dispensa, inexigibilidade...), como a fonte informa."}
      - {name: situacao, description: "Situação do contrato, como a fonte informa."}
      - {name: cd_orgao_superior, description: "Código SIAFI do órgão superior (ministério ou equivalente)."}
      - {name: orgao_superior, description: "Nome do órgão superior."}
      - {name: cd_orgao, description: "Código SIAFI do órgão contratante."}
      - {name: orgao, description: "Nome do órgão contratante."}
      - {name: cd_ug, description: "Código SIAFI da unidade gestora contratante.", tests: ["not_null"]}
      - {name: ug, description: "Nome da unidade gestora contratante."}
      - {name: dt_assinatura, description: "Data de assinatura do contrato."}
      - {name: dt_publicacao_dou, description: "Data de publicação no Diário Oficial da União."}
      - {name: dt_inicio_vigencia, description: "Data de início da vigência."}
      - {name: dt_fim_vigencia, description: "Data de fim da vigência."}
      - {name: cd_contratado, meta: {pii: true}, description: "CNPJ, CPF ou código de estrangeiro do contratado, como a fonte publica. CPF (11 dígitos, completo na fonte) sai mascarado (***.nnn.nnn-**) pelo projeto; o original fica no landing e no raw (privados). `-11` quando a fonte protege por sigilo."}
      - {name: contratado, meta: {pii: true}, description: "Nome do contratado (pessoa física inclusive), como a fonte publica; número de CPF no texto é mascarado pelo projeto. `Sigiloso` quando protegido por sigilo."}
      - {name: valor_inicial, description: "Valor inicial do contrato, em reais."}
      - {name: valor_final, description: "Valor final do contrato (com aditivos), em reais."}
      - {name: numero_licitacao, description: "Número da licitação de origem, quando houve."}
      - {name: cd_ug_licitacao, description: "Código SIAFI da unidade gestora da licitação."}
      - {name: ug_licitacao, description: "Nome da unidade gestora da licitação."}
      - {name: cd_modalidade_licitacao, description: "Código da modalidade da licitação."}
      - {name: modalidade_licitacao, description: "Modalidade da licitação."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}
      - {name: fonte, description: "Fonte oficial do registro (camara, senado, tse...), igual ao prefixo do modelo."}
      - {name: dt_captura, description: "Instante (UTC) em que o arquivo de origem foi capturado pela primeira vez (metadata.capturas)."}
      - {name: url_fonte, description: "Endereço oficial de onde o arquivo de origem foi baixado."}
      - {name: sha256_captura, description: "Impressão digital (SHA-256) do arquivo de origem: prova de que é o que a fonte entregou."}
