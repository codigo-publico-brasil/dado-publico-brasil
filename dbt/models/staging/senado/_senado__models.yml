version: 2

models:
  - name: stg_senado__senadores
    description: Senadores, uma linha por senador (o mais recente dos arquivos de legislatura), com nomes padronizados.
    columns:
      - name: senador_id
        tests: [unique, not_null]
      - name: nome
        tests: [not_null]
  - name: stg_senado__votacoes
    description: Votações em plenário com resultado, totais e a matéria votada. Votação secreta tem `secreta` verdadeiro.
    columns:
      - name: votacao_id
        tests: [unique, not_null]
      - name: data
        tests: [not_null]
  - name: stg_senado__votos
    description: Voto de cada senador em cada votação nominal. Em votação secreta a sigla é "Votou".
    columns:
      - name: votacao_id
        tests: [not_null]
      - name: senador_id
        tests: [not_null]
  - name: stg_senado__processos
    description: Processo de cada matéria votada (só as já buscadas), com a situação atual e a norma gerada.
    columns:
      - name: processo_id
        tests: [unique, not_null]
      - name: materia_id
        tests: [not_null]
  - name: stg_senado__exercicios
    description: Exercício oficial de cada senador em cada mandato (titular ou suplente), com a causa de afastamento.
    columns:
      - name: exercicio_id
        tests: [not_null]
  - name: stg_senado__normas
    description: Catálogo das normas federais, uma linha por norma, só metadados, com a ementa padronizada e a original.
    columns:
      - name: norma_id
        tests: [unique, not_null]
  - name: stg_senado__normas_publicacoes
    description: Publicações de cada norma detalhada (e da Constituição) no Diário Oficial, uma linha por norma e publicação.
    columns:
      - name: norma_id
        tests: [not_null]
  - name: stg_senado__normas_relacoes
    description: Relações de cada norma detalhada (e da Constituição) com atos posteriores, uma linha por norma, ato e tipo de relação.
    columns:
      - name: norma_id
        tests: [not_null]
  - name: stg_senado__vetos
    description: Vetos presidenciais apreciados pelo Congresso, uma linha por veto, com a matéria vetada e a norma gerada.
    columns:
      - name: veto_id
        tests: [unique, not_null]
  - name: stg_senado__vetos_dispositivos
    description: Dispositivos vetados de cada veto buscado, com o texto vetado, a razão do veto e a situação.
    columns:
      - name: dispositivo_id
        tests: [unique, not_null]
  - name: stg_senado__vetos_votos
    description: Voto nominal de cada deputado e senador num dispositivo vetado, sem o código do parlamentar.
    columns:
      - name: dispositivo_id
        tests: [not_null]
  - name: stg_senado__senadores_detalhe
    description: Detalhe de cada senador (só os já buscados), com nome civil, nascimento, naturalidade e foto.
    columns:
      - name: senador_id
        tests: [unique, not_null]
