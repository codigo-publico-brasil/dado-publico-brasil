version: 2

models:
  - name: stg_tse__candidaturas
    description: Candidaturas de todos os cargos nas eleições gerais e municipais, uma linha por candidatura e turno.
    columns:
      - {name: ano_eleicao, description: "Ano da eleição que a formou."}
      - {name: turno, description: "Turno da votação."}
      - {name: dt_eleicao, description: "Dia em que o turno foi votado, como o TSE informa (DT_ELEICAO)."}
      - {name: sq_candidato, description: "Número sequencial do candidato na eleição, como o TSE informa (único só dentro da unidade eleitoral)."}
      - {name: id_candidatura, description: "Identificador da candidatura na fonte: ano da eleição e sequencial do candidato.", tests: ["not_null"]}
      - {name: cd_eleicao, description: "Código da eleição, como o TSE informa; vazio nos arquivos antigos que não trazem."}
      - {name: eleicao, description: "Descrição da eleição, como o TSE informa (por exemplo, Eleições Municipais 2024 ou uma eleição suplementar); vazia nos arquivos antigos que não trazem."}
      - {name: ue, description: "Código da unidade eleitoral, como o TSE informa: sigla da UF, BR para presidente ou o código do município."}
      - {name: ue_nome, description: "Nome da unidade eleitoral (município, estado ou Brasil), como o TSE informa."}
      - {name: uf, description: "UF de eleição ou representação nos votos da legislatura."}
      - {name: cargo, description: "Cargo exercido."}
      - {name: cd_cargo, description: "Código do cargo no TSE (1 presidente, 3 governador, 5 senador, 6 deputado federal, 11 prefeito, 13 vereador...), como a fonte informa."}
      - {name: numero_partido, description: "Número do partido na urna, como o TSE informa. Não identifica o partido ao longo do tempo: o mesmo número já foi usado por partidos diferentes."}
      - {name: numero, description: "Número da norma."}
      - {name: nome, description: "Nome parlamentar, com caixa padronizada.", tests: ["not_null"]}
      - {name: nome_urna, description: "Nome de urna, com caixa padronizada."}
      - {name: situacao_candidatura, description: "Situação da candidatura segundo a fonte (por exemplo, deferido)."}
      - {name: partido_sigla, description: "Sigla do partido, como a fonte informa."}
      - {name: partido_nome, description: "Nome do partido na eleição."}
      - {name: dt_nascimento, description: "Data de nascimento informada pela fonte."}
      - {name: genero, description: "Gênero, como a fonte informa."}
      - {name: resultado, description: "Resultado da votação segundo a fonte (eleito por QP, eleito por média, suplente, não eleito); vazio se não informado."}
      - {name: nome_social, meta: {pii: true}, description: "Nome social declarado pelo candidato, com caixa padronizada; vazio se não declarou. O TSE às vezes repete o nome civil ou grava Não divulgável (dado protegido); fica como a fonte informa."}
      - {name: grau_instrucao, meta: {pii: true}, description: "Grau de instrução declarado pelo candidato, como o TSE informa; Não divulgável quando o TSE protege o dado."}
      - {name: estado_civil, meta: {pii: true}, description: "Estado civil declarado pelo candidato, como o TSE informa; Não divulgável quando o TSE protege o dado."}
      - {name: ocupacao, description: "Ocupação declarada pelo candidato, como o TSE informa; Não divulgável quando o TSE protege o dado."}
      - {name: uf_nascimento, description: "UF de nascimento do candidato, como o TSE informa."}
      - {name: coligacao_nome, description: "Nome da coligação da candidatura, como o TSE informa; vazio sem coligação."}
      - {name: coligacao_composicao, description: "Partidos da coligação, como o TSE informa."}
      - {name: federacao_sigla, description: "Sigla da federação partidária (desde 2022); vazia nos anos anteriores."}
      - {name: federacao_composicao, description: "Partidos da federação (desde 2022); vazia nos anos anteriores."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}
  - name: stg_tse__bens
    description: Bens declarados pelos candidatos de todos os cargos, uma linha por bem.
    columns:
      - {name: ano_eleicao, description: "Ano da eleição que a formou."}
      - {name: sq_candidato, description: "Número sequencial do candidato na eleição, como o TSE informa (único só dentro da unidade eleitoral)."}
      - {name: id_candidatura, description: "Identificador da candidatura na fonte: ano da eleição e sequencial do candidato.", tests: ["not_null"]}
      - {name: ue, description: "Sigla da unidade eleitoral (UF ou BR), como o TSE informa."}
      - {name: uf, description: "UF de eleição ou representação nos votos da legislatura."}
      - {name: ordem, description: "Posição do parágrafo no arquivo, a partir de 1."}
      - {name: cd_tipo, description: "Código do tipo, como a fonte informa."}
      - {name: tipo, description: "Mudança de nome, fusão ou incorporação."}
      - {name: descricao, description: "Descrição oficial da votação, com caixa padronizada."}
      - {name: valor, description: "Valor declarado em reais, sem correção."}
      - {name: dt_atualizacao, description: "Data da última atualização do bem na declaração."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}
  - name: stg_tse__votacao
    description: Votos de cada candidato (todos os cargos) por município e zona, como o TSE publica.
    columns:
      - {name: ano_eleicao, description: "Ano da eleição que a formou."}
      - {name: turno, description: "Turno da votação."}
      - {name: dt_eleicao, description: "Dia em que o turno foi votado, como o TSE informa (DT_ELEICAO)."}
      - {name: abrangencia, description: "Abrangência da eleição, como o TSE informa (campo TP_ABRANGENCIA)."}
      - {name: uf, description: "UF de eleição ou representação nos votos da legislatura."}
      - {name: cd_ue, description: "Código da unidade eleitoral do cargo: BR para presidente, a sigla da UF para os cargos estaduais e federais e o código do município para prefeito e vereador, igual ao das candidaturas."}
      - {name: ue_nome, description: "Nome da unidade eleitoral, como o TSE informa."}
      - {name: cd_municipio, description: "Código do município, como a fonte informa."}
      - {name: municipio, description: "Município de aplicação."}
      - {name: zona, description: "Zona eleitoral, como o TSE informa."}
      - {name: cd_cargo, description: "Código do cargo disputado, como o TSE informa."}
      - {name: cargo, description: "Cargo exercido."}
      - {name: sq_candidato, description: "Número sequencial do candidato na eleição, como o TSE informa (único só dentro da unidade eleitoral)."}
      - {name: id_candidatura, description: "Identificador da candidatura na fonte: ano da eleição e sequencial do candidato.", tests: ["not_null"]}
      - {name: numero, description: "Número da norma."}
      - {name: nome, description: "Nome parlamentar, com caixa padronizada."}
      - {name: nome_urna, description: "Nome de urna, com caixa padronizada."}
      - {name: situacao_candidatura, description: "Situação da candidatura segundo a fonte (por exemplo, deferido)."}
      - {name: detalhe_situacao, description: "Detalhe da situação, como a fonte informa."}
      - {name: partido_numero, description: "Número do partido, como o TSE informa."}
      - {name: partido_sigla, description: "Sigla do partido, como a fonte informa."}
      - {name: federacao_sigla, description: "Sigla da federação partidária, como a fonte informa."}
      - {name: fl_voto_em_transito, description: "Verdadeiro se o voto foi em trânsito, como o TSE informa (campo ST_VOTO_EM_TRANSITO)."}
      - {name: votos_nominais, description: "Votos nominais recebidos, de qualquer destinação."}
      - {name: destinacao, description: "Destinação dos votos, como o TSE informa (campo NM_TIPO_DESTINACAO_VOTOS)."}
      - {name: votos_validos, description: "Votos nominais válidos; nos arquivos de 2002 a 2014, que não separam os válidos, os votos nominais."}
      - {name: resultado, description: "Resultado da votação segundo a fonte (eleito por QP, eleito por média, suplente, não eleito); vazio se não informado."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}

  - name: stg_tse__vagas
    description: Vagas de cada cargo em cada unidade eleitoral, uma linha por eleição, cargo e unidade, como o TSE publica; traz também as eleições suplementares.
    columns:
      - {name: ano_eleicao, description: "Ano da eleição."}
      - {name: cd_eleicao, description: "Código da eleição, como o TSE informa (distingue a eleição geral da suplementar no mesmo ano)."}
      - {name: eleicao, description: "Descrição da eleição, como o TSE informa (por exemplo, Eleição Geral Federal 2022 ou Eleição Suplementar)."}
      - {name: ue, description: "Código da unidade eleitoral, como o TSE informa: sigla da UF, BR para presidente ou o código do município."}
      - {name: ue_nome, description: "Nome da unidade eleitoral (município, estado ou Brasil), como o TSE informa."}
      - {name: uf, description: "Sigla da unidade da federação, como a fonte informa."}
      - {name: cd_cargo, description: "Código do cargo disputado, como o TSE informa."}
      - {name: cargo, description: "Cargo em disputa, com caixa padronizada."}
      - {name: qtd_vagas, description: "Quantidade de vagas do cargo na unidade eleitoral."}
      - {name: dt_posse, description: "Data de posse prevista, como o TSE informa. Não confirmada: em 2026 o arquivo de vagas traz 02/05/2027 para deputados e senadores, que não bate com a posse real (issue #71); não use como data legal da posse."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}

  - name: stg_tse__receitas_candidatos
    description: Receitas declaradas pelos candidatos de todos os cargos, uma linha por receita; o valor é o declarado, sem nome nem documento de quem doou.
    columns:
      - {name: ano_eleicao, description: "Ano da eleição."}
      - {name: turno, description: "Turno da prestação de contas, como o TSE informa (campo ST_TURNO)."}
      - {name: id_candidatura, description: "Identificador da candidatura (ano, unidade eleitoral e sequencial), igual ao de stg_tse__candidaturas."}
      - {name: sq_candidato, description: "Número sequencial do candidato na eleição, como o TSE informa (único só dentro da unidade eleitoral)."}
      - {name: sq_prestador_contas, description: "Número sequencial do prestador de contas (a campanha do candidato), como o TSE informa."}
      - {name: sq_receita, description: "Número sequencial da receita, como o TSE informa."}
      - {name: ue, description: "Sigla da unidade eleitoral (UF ou BR), como o TSE informa."}
      - {name: uf, description: "Sigla da unidade da federação, como a fonte informa."}
      - {name: cargo, description: "Cargo disputado, com caixa padronizada."}
      - {name: tipo_prestacao, description: "Tipo da prestação de contas (por exemplo, parcial ou final), como o TSE informa."}
      - {name: dt_prestacao, description: "Data da prestação de contas."}
      - {name: dt_receita, description: "Data da receita."}
      - {name: valor, description: "Valor da receita em reais, como declarado."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}

  - name: stg_tse__despesas_candidatos
    description: Despesas contratadas declaradas pelos candidatos de todos os cargos, uma linha por despesa; o valor é o declarado, sem nome nem documento do fornecedor.
    columns:
      - {name: ano_eleicao, description: "Ano da eleição."}
      - {name: turno, description: "Turno da prestação de contas, como o TSE informa (campo ST_TURNO)."}
      - {name: id_candidatura, description: "Identificador da candidatura (ano, unidade eleitoral e sequencial), igual ao de stg_tse__candidaturas."}
      - {name: sq_candidato, description: "Número sequencial do candidato na eleição, como o TSE informa (único só dentro da unidade eleitoral)."}
      - {name: sq_prestador_contas, description: "Número sequencial do prestador de contas (a campanha do candidato), como o TSE informa."}
      - {name: sq_despesa, description: "Número sequencial da despesa, como o TSE informa."}
      - {name: ue, description: "Sigla da unidade eleitoral (UF ou BR), como o TSE informa."}
      - {name: uf, description: "Sigla da unidade da federação, como a fonte informa."}
      - {name: cargo, description: "Cargo disputado, com caixa padronizada."}
      - {name: tipo_prestacao, description: "Tipo da prestação de contas (por exemplo, parcial ou final), como o TSE informa."}
      - {name: dt_prestacao, description: "Data da prestação de contas."}
      - {name: dt_despesa, description: "Data da despesa."}
      - {name: valor, description: "Valor da despesa contratada em reais, como declarado."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}
  - name: stg_tse__fotos
    description: Arquivos de foto oficial das candidaturas das eleições gerais, um por imagem dentro de cada pacote por UF do TSE.
    columns:
      - {name: ano_eleicao, description: "Ano da eleição do pacote de fotos."}
      - {name: pacote_uf, description: "UF do pacote (BR traz presidente e vice)."}
      - {name: sq_candidato, description: "Número sequencial do candidato na eleição, tirado do nome do arquivo; liga à candidatura.", tests: ["not_null"]}
      - {name: arquivo, description: "Nome do arquivo de imagem dentro do pacote (F, UF, sequencial e _div, com a extensão original)."}
      - {name: tamanho_bytes, description: "Tamanho da imagem em bytes, como o pacote informa."}
      - {name: id_captura, description: "Identificador da captura (arquivo do landing) de onde o registro veio: liga a linha ao arquivo original, com hash e data."}
