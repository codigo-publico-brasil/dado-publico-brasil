version: 2

sources:
  - name: tse
    description: >
      Tribunal Superior Eleitoral, dados abertos (pacotes .zip com CSV). Carregado pelo dlt em raw_federal_tse (declaração em
      sources/judiciario/federal/tse.yml): só candidaturas ao Congresso, sem CPF, título de eleitor nem e-mail.
      Fonte oficial: [https://dadosabertos.tse.jus.br](https://dadosabertos.tse.jus.br).
    schema: raw_federal_tse
    loaded_at_field: to_timestamp(cast(_dlt_load_id as double))
    freshness:
      warn_after: {count: 400, period: day}
      error_after: {count: 1500, period: day}
    meta:
      url: https://dadosabertos.tse.jus.br
      origin: Tribunal Superior Eleitoral
      sensitivity: publico-agente-publico
      owner: fundador do projeto
    tables:
      - name: candidaturas
        description: Candidaturas a deputado federal e senador (e suplentes) nas eleições gerais, uma linha por candidatura.
      - name: bens
        description: Bens declarados pelos candidatos de todos os cargos nas eleições gerais de 2006 em diante, uma linha por bem.
      - name: votacao
        description: Votos de cada candidato (todos os cargos) por município e zona nas eleições gerais já carregadas, como o TSE publica.
      - name: vagas
        description: Quantidade de vagas de cada cargo em cada unidade eleitoral nas eleições gerais (por exemplo, 513 de deputado federal), uma linha por cargo e unidade, como o TSE publica.
      - name: receitas_candidatos
        description: Receitas declaradas na prestação de contas dos candidatos de todos os cargos, uma linha por receita, só com as colunas do total (sem nome nem documento de quem doou), como o TSE publica.
      - name: despesas_candidatos
        description: Despesas contratadas declaradas na prestação de contas dos candidatos de todos os cargos, uma linha por despesa, só com as colunas do total (sem nome nem documento do fornecedor), como o TSE publica.
