# Projeto dbt da camada de dados (ADR 0006). Segue o guia de estrutura da dbt Labs:
#   staging       1 modelo por tabela do raw: renomear, tipar, padronizar. Views. Sem joins.
#   intermediate  uma finalidade por modelo (re-granularidade, joins, resolução de identidade).
#   core          referências do modelo (ADR 0030): pessoas, órgãos, territórios, cargos, partidos, eleições, disputas, tipos de evento.
#   fatos         o que aconteceu, datado e com a fonte: candidaturas, resultados, campanhas, mandatos, exercícios, filiações (ADR 0030).
#   marts         entidades prontas para consumo, uma por grain, com contrato de colunas.
name: dado_publico_brasil
version: "0.1.0"
profile: dado_publico_brasil
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target"]

on-run-start:
  - "{{ create_text_functions() }}"

vars:
  source_camara: camara
  id_type_camara: deputado
  source_senado: senado
  id_type_senado: senador
  source_tse: tse
  id_type_tse: candidato
  id_type_tse_eleito: candidatura_de_eleito
  url_proposicao_camara: "https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao="
  url_materia_senado: "https://www25.senado.leg.br/web/atividade/materias/-/materia/"

models:
  elementary:
    +schema: elementary
  dado_publico_brasil:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
      +meta:
        sensitivity: publico-agente-publico
        owner: fundador do projeto
      camara:
        +tags: [pre_identity]
      senado:
        +tags: [pre_identity]
      tse:
        +tags: [pre_identity]
      constituicao:
        +tags: [pre_identity]
      metadata:
        +tags: [pre_identity]
    intermediate:
      +schema: intermediate
      +materialized: table
      +meta:
        sensitivity: publico-agente-publico
        owner: fundador do projeto
    core:
      +schema: core
      +materialized: table
      +contract:
        enforced: true
      +meta:
        owner: fundador do projeto
    fatos:
      +schema: fatos
      +materialized: table
      +contract:
        enforced: true
      +meta:
        owner: fundador do projeto
    marts:
      +schema: marts
      +materialized: table
      +contract:
        enforced: true

seeds:
  dado_publico_brasil:
    +schema: intermediate
    +tags: [pre_identity]
    +persist_docs:
      relation: true
      columns: true
    core:
      +schema: core
      +column_types: {cd_cargo_tse: integer, duracao_anos: integer, id_partido: integer, id_partido_sucessor: integer, ano_fim: integer, nr_partido: integer, ano_inicio: integer, ano_eleicao_de: integer, ano_eleicao_ate: integer, mes_posse: integer, dia_posse: integer}
      vinculos_aprovados:
        +full_refresh: true  # sem isso, o seed criado vazio fica com tipos inferidos errados quando entra a primeira linha
        +column_types: {origem_fonte: varchar, origem_tipo: varchar, id_origem: varchar, destino_fonte: varchar, destino_tipo: varchar, id_destino: varchar, aprovado_por: varchar, dt_aprovacao: date, evidencia: varchar}
      partidos_eventos:
        +column_types: {dt_aprovacao: date, ano: integer}

data_tests:
  dado_publico_brasil:
    +severity: error
