# Projeto dbt da camada de dados (ADR 0006). Segue o guia de estrutura da dbt Labs:
#   Toda tabela leva em meta: owner, sensitivity e fonte_oficial; sem fonte e captura próprias, auditoria_excecao diz por quê.
#   staging       1 modelo por tabela do raw: renomear, tipar, padronizar. Views (tabela só no TSE, ADR 0044). Sem joins.
#   intermediate  uma finalidade por modelo (re-granularidade, joins, resolução de identidade).
#   marts         entidades e consultas prontas, com contrato de colunas, nomeadas pelo tipo (ADR 0033):
#                 dim_ (dimensão), fct_ (fato), brg_ (ponte) e agg_ (agregado).
name: dado_publico_brasil
version: "0.1.0"
profile: dado_publico_brasil
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target"]

on-run-start:
  - "{{ create_text_functions() }}"

vars:
  test_sample_row_count: 0  # o relatório do Elementary é público: sem amostras de linhas dos testes
  source_camara: camara
  id_type_camara: deputado
  source_senado: senado
  id_type_senado: senador
  source_tse: tse
  colecao_fotos_tse: staging/judiciario/federal/tse/arq_fotos  # pasta da coleção no lake (sources/.../tse.yml: arquivos)
  id_type_tse: candidato
  id_type_tse_eleito: candidatura_de_eleito
  url_proposicao_camara: "https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao="
  url_materia_senado: "https://www25.senado.leg.br/web/atividade/materias/-/materia/"

models:
  elementary:
    +schema: elementary
    +docs: {show: false}  # modelos do pacote ficam fora do site público
  dado_publico_brasil:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
      +meta:
        sensitivity: publico-agente-publico
        owner: fundador do projeto
      camara:
        +tags: [pre_identity]
        +meta: {fonte_oficial: Câmara dos Deputados}
      senado:
        +tags: [pre_identity]
        +meta: {fonte_oficial: Senado Federal}
      tse:
        +materialized: table  # exceção ao "staging = views" (ADR 0044): lido dezenas de vezes por noite, com limpeza de texto cara
        +tags: [pre_identity]
        +meta: {fonte_oficial: Tribunal Superior Eleitoral}
      ibge:
        +meta: {fonte_oficial: IBGE}
      transparencia:
        +meta: {fonte_oficial: Portal da Transparência (CGU)}
      constituicao:
        +tags: [pre_identity]
        +meta: {fonte_oficial: Câmara dos Deputados (texto da Constituição)}
      metadata:
        +tags: [pre_identity]
        +meta: {fonte_oficial: Projeto (registro das capturas), auditoria_excecao: Tabela do projeto que descreve as capturas; não vem de arquivo de fonte.}
      identity:
        +meta: {fonte_oficial: Projeto (identidade interna), auditoria_excecao: Tabela interna do projeto (schema identity); não vem de arquivo de fonte.}
    intermediate:
      +schema: intermediate
      +materialized: table
      +meta:
        sensitivity: publico-agente-publico
        owner: fundador do projeto
    marts:
      +schema: marts
      +materialized: table
      +contract:
        enforced: true
      +meta:
        owner: fundador do projeto

seeds:
  dado_publico_brasil:
    +schema: intermediate
    +tags: [pre_identity]
    +persist_docs:
      relation: true
      columns: true
    +column_types: {cd_cargo_tse: integer, duracao_anos: integer, id_partido: integer, id_partido_sucessor: integer, ano_fim: integer, nr_partido: integer, ano_inicio: integer, ano_eleicao_de: integer, ano_eleicao_ate: integer, mes_posse: integer, dia_posse: integer}
    marts:
      +schema: marts
    intermediate:
      vinculos_aprovados:
        +full_refresh: true  # sem isso, o seed criado vazio fica com tipos inferidos errados quando entra a primeira linha
        +column_types: {origem_fonte: varchar, origem_tipo: varchar, id_origem: varchar, destino_fonte: varchar, destino_tipo: varchar, id_destino: varchar, aprovado_por: varchar, dt_aprovacao: date, evidencia: varchar}
      partidos_eventos:
        +column_types: {dt_aprovacao: date, ano: integer}

data_tests:
  dado_publico_brasil:
    +severity: error
