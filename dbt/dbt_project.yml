# Projeto dbt da camada de dados (ADR 0006). Segue o guia de estrutura da dbt Labs:
#   staging       1 modelo por tabela do raw: renomear, tipar, padronizar. Views. Sem joins.
#   intermediate  uma finalidade por modelo (re-granularidade, joins, resolução de identidade).
#   marts         entidades prontas para consumo, uma por grain, com contrato de colunas.
name: quem_decidiu
version: "0.1.0"
profile: quem_decidiu
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target"]

on-run-start:
  - "{{ create_text_functions() }}"

vars:
  source_camara: camara
  id_type_camara: deputado
  source_senado: senado
  id_type_senado: senador
  source_tse: tse
  id_type_tse: candidato
  url_proposicao_camara: "https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao="
  url_materia_senado: "https://www25.senado.leg.br/web/atividade/materias/-/materia/"

models:
  quem_decidiu:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
      +meta:
        sensitivity: publico-agente-publico
        owner: fundador do projeto
      camara:
        +tags: [pre_identity]
      senado:
        +tags: [pre_identity]
      tse:
        +tags: [pre_identity]
      constituicao:
        +tags: [pre_identity]
      metadata:
        +tags: [pre_identity]
    intermediate:
      +schema: intermediate
      +materialized: table
      +meta:
        sensitivity: publico-agente-publico
        owner: fundador do projeto
    marts:
      +schema: marts
      +materialized: table
      +contract:
        enforced: true

seeds:
  quem_decidiu:
    +schema: intermediate
    +tags: [pre_identity]
    vinculos_aprovados:
      +column_types: {origem_id: varchar, destino_id: varchar, aprovado_em: date}
    eventos_de_partidos:
      +column_types: {aprovado_em: date, ano: integer}

data_tests:
  quem_decidiu:
    +severity: error
