version: 2

seeds:
  - name: partidos_eventos
    description: Mudanças de nome, fusões e incorporações de partidos, conferidas à mão no TSE, com a página oficial de cada evento. Alimenta partidos_linhagem. Uma linha por partido de origem e evento.
    columns:
      - {name: sigla_anterior, description: "Sigla do partido antes do evento, como aparece nos votos."}
      - {name: sigla_posterior, description: "Sigla depois do evento (a do partido resultante, em fusão e incorporação)."}
      - {name: tipo, description: "Mudança de nome, fusão ou incorporação."}
      - {name: dt_aprovacao, description: "Data da aprovação pelo TSE; vazia quando só o mês é conhecido."}
      - {name: ano, description: "Ano do evento."}
      - {name: fonte_url, description: "Página oficial do TSE que registra o evento."}
      - {name: observacao, description: "Divergência de data, resolução ou ressalva da fonte."}

  - name: vinculos_aprovados
    description: Vínculos entre registros de fontes diferentes que a regra automática não resolve (homônimo, nome diferente entre as fontes), conferidos por uma pessoa, com a evidência escrita. Uma linha por vínculo aprovado.
    columns:
      - {name: origem_fonte, description: "Fonte do registro de origem do vínculo (por exemplo, tse)."}
      - {name: origem_tipo, description: "Tipo de identificador do registro de origem (por exemplo, candidato)."}
      - {name: id_origem, description: "Identificador do registro de origem, na fonte de origem."}
      - {name: destino_fonte, description: "Fonte do registro de destino do vínculo (por exemplo, camara)."}
      - {name: destino_tipo, description: "Tipo de identificador do registro de destino (por exemplo, deputado)."}
      - {name: id_destino, description: "Identificador do registro de destino, na fonte de destino."}
      - {name: aprovado_por, description: "Quem conferiu e aprovou o vínculo."}
      - {name: dt_aprovacao, description: "Data em que o vínculo foi aprovado."}
      - {name: evidencia, description: "Evidência escrita que justifica o vínculo, com o endereço da fonte."}
