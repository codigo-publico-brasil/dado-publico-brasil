# Declaração da fonte: Tribunal Superior Eleitoral (Justiça Eleitoral), dados abertos. Os arquivos são pacotes
# .zip com um CSV por UF e um `_BRASIL.csv` que reúne todos (por isso só ele é lido).
# Minimização: CPF, título de eleitor, e-mail e nome social não estão em `columns` (nunca entram no raw). Todos os
# cargos entram no raw; os marts só expõem quem já é pessoa do projeto (ADR 0013). A candidatura se identifica por
# ano, unidade eleitoral (SG_UE: UF, ou BR para presidente) e sequencial: o sequencial se repete entre estados
# em 2002 e 2006 (ADR 0017).
# O landing guarda o pacote original, com hash.

source: tse
power: judiciario
level: federal
description: Tribunal Superior Eleitoral, dados abertos (CKAN; pacotes .zip com CSV)

# Regra de extração: o TSE muda em datas pontuais (eleição, apuração, prestação de contas), então nada entra na execução
# diária: cada dataset roda quando pedido (`dado-publico extract --source tse --years 2026`), um por vez nos pesados.
refresh: on_request

access:
  base_url: https://cdn.tse.jus.br/estatistica/sead/odsele
  format: csv
  delimiter: ";"
  encoding: latin-1

datasets:
  candidaturas:
    url: "{base_url}/consulta_cand/consulta_cand_{year}.zip"
    load: yearly
    first_year: 1996                # a eleição mais antiga com o mesmo layout (a de 1994 tem outro nome de arquivo)
    step: 2                         # as eleições gerais (1998, 2002, ... 2026) e as municipais (1996, 2000, ... 2024)
    archive: zip
    member: "*_BRASIL.csv"
    write: merge
    primary_key: [ANO_ELEICAO, CD_ELEICAO, SG_UE, SQ_CANDIDATO, NR_TURNO]   # o sequencial se repete entre a eleição ordinária e a suplementar do mesmo município (2004)
    columns:
      [ANO_ELEICAO, NR_TURNO, CD_ELEICAO, DS_ELEICAO, SG_UF, SG_UE, NM_UE, DS_CARGO, SQ_CANDIDATO, NR_CANDIDATO,
       NM_CANDIDATO, NM_URNA_CANDIDATO, DS_SITUACAO_CANDIDATURA, SG_PARTIDO, NM_PARTIDO, DT_NASCIMENTO, DS_GENERO,
       DS_SIT_TOT_TURNO]

  bens:
    # Bens declarados por cada candidato (todos os cargos): descrição, tipo e valor. Liga-se à candidatura por
    # SQ_CANDIDATO. Só existe de 2006 em diante. Não há documento pessoal nestas colunas.
    url: "{base_url}/bem_candidato/bem_candidato_{year}.zip"
    load: yearly
    first_year: 2006
    step: 2                         # 2006, 2008 (primeira municipal com bens), ... 2026
    archive: zip
    member: "*_BRASIL.csv"
    write: merge
    primary_key: [_row_hash]        # o número do bem não é único em 2006: a chave é o conteúdo da linha
    aliases:                        # os arquivos de 2006 e 2010 usam outros nomes
      NR_ORDEM_CANDIDATO: NR_ORDEM_BEM_CANDIDATO
      DT_ULTIMA_ATUALIZACAO: DT_ULT_ATUAL_BEM_CANDIDATO
    columns:
      [ANO_ELEICAO, CD_ELEICAO, DS_ELEICAO, SG_UF, SG_UE, SQ_CANDIDATO, NR_ORDEM_BEM_CANDIDATO, CD_TIPO_BEM_CANDIDATO, DS_TIPO_BEM_CANDIDATO,
       DS_BEM_CANDIDATO, VR_BEM_CANDIDATO, DT_ULT_ATUAL_BEM_CANDIDATO]

  votacao:
    # Votos de cada candidato (todos os cargos) por município e zona: cerca de 9,4 milhões de linhas e 4,3 GB só
    # em 2022. Pesado: peça por ano (`--years 2022`). O nome social não entra (minimização).
    url: "{base_url}/votacao_candidato_munzona/votacao_candidato_munzona_{year}.zip"
    load: yearly
    first_year: 1996
    step: 2
    archive: zip
    member: "*_BRASIL.csv"
    write: merge
    primary_key: [_row_hash]
    columns:
      [ANO_ELEICAO, NR_TURNO, CD_ELEICAO, DS_ELEICAO, TP_ABRANGENCIA, SG_UF, SG_UE, NM_UE, CD_MUNICIPIO, NM_MUNICIPIO, NR_ZONA, CD_CARGO,
       DS_CARGO, SQ_CANDIDATO, NR_CANDIDATO, NM_CANDIDATO, NM_URNA_CANDIDATO, DS_SITUACAO_CANDIDATURA,
       DS_DETALHE_SITUACAO_CAND, NR_PARTIDO, SG_PARTIDO, SG_FEDERACAO, ST_VOTO_EM_TRANSITO, QT_VOTOS_NOMINAIS,
       NM_TIPO_DESTINACAO_VOTOS, QT_VOTOS_NOMINAIS_VALIDOS, DS_SIT_TOT_TURNO]

  vagas:
    # Quantas vagas cada cargo tem em cada unidade eleitoral (por exemplo, 54 de senador e 513 de deputado federal em
    # 2026, ou as 11 de vereador de um município). É o que permite saber se alguma vaga ficou sem eleito. A coluna
    # `QT_VAGAS` do arquivo de 2000 (e de outros anos) é a `QT_VAGA` dos demais.
    url: "{base_url}/consulta_vagas/consulta_vagas_{year}.zip"
    load: yearly
    first_year: 1996
    step: 2
    archive: zip
    member: "*_BRASIL.csv"
    write: merge
    aliases:
      QT_VAGAS: QT_VAGA
    primary_key: [ANO_ELEICAO, CD_ELEICAO, SG_UE, CD_CARGO]   # o arquivo de 2022 traz também a eleição suplementar de RR
    columns: [ANO_ELEICAO, CD_ELEICAO, DS_ELEICAO, DT_POSSE, SG_UF, SG_UE, NM_UE, CD_CARGO, DS_CARGO, QT_VAGA]

  receitas_candidatos:
    # Prestação de contas dos candidatos: uma linha por receita. Só as colunas do total arrecadado; o nome e o
    # documento de quem doou não entram (minimização). Os dois datasets de prestação leem o mesmo pacote (distintos
    # pelo fragmento da URL, que não vai ao servidor); o pacote de 2022 tem centenas de MB: peça por ano.
    url: "{base_url}/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_{year}.zip#receitas"
    load: yearly
    first_year: 2022
    step: 4
    archive: zip
    member: "receitas_candidatos_[0-9]*_BRASIL.csv"   # não pega receitas_candidatos_doador_originario_*
    write: merge
    primary_key: [_row_hash]   # SQ_RECEITA se repete entre itens do mesmo lançamento; o hash guarda todas as linhas
    columns:
      [AA_ELEICAO, ST_TURNO, TP_PRESTACAO_CONTAS, DT_PRESTACAO_CONTAS, SQ_PRESTADOR_CONTAS, SG_UF, SG_UE, DS_CARGO,
       SQ_CANDIDATO, SQ_RECEITA, DT_RECEITA, DS_RECEITA, VR_RECEITA]

  despesas_candidatos:
    # Despesas contratadas pelos candidatos (o 2022 descompactado tem 1,3 GB). Mesmo pacote e mesma minimização:
    # sem o nome nem o documento do fornecedor.
    url: "{base_url}/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_{year}.zip#despesas"
    load: yearly
    first_year: 2022
    step: 4
    archive: zip
    member: "despesas_contratadas_candidatos_*_BRASIL.csv"
    write: merge
    primary_key: [_row_hash]   # SQ_DESPESA se repete entre itens do mesmo lançamento; o hash guarda todas as linhas
    columns:
      [AA_ELEICAO, ST_TURNO, TP_PRESTACAO_CONTAS, DT_PRESTACAO_CONTAS, SQ_PRESTADOR_CONTAS, SG_UF, SG_UE, DS_CARGO,
       SQ_CANDIDATO, SQ_DESPESA, DT_DESPESA, DS_DESPESA, VR_DESPESA_CONTRATADA]
