    url: "https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes{year}/fotos/foto_cand{year}_ES_div.zip"
  fotos_go:
    <<: *fotos
    url: "https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes{year}/fotos/foto_cand{year}_GO_div.zip"
  fotos_ma:
