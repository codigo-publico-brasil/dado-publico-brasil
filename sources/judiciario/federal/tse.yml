# Declaração da fonte: Tribunal Superior Eleitoral (Justiça Eleitoral), dados abertos. Os arquivos são pacotes
# .zip com um CSV por UF e um `_BRASIL.csv` que reúne todos (por isso só ele é lido).
# Minimização: CPF, título de eleitor, e-mail e nome social não estão em `columns` (nunca entram no raw). Todos os
# cargos entram no raw; os marts só expõem quem já é pessoa do projeto (ADR 0013). A candidatura se identifica por
# ano, unidade eleitoral (SG_UE: UF, ou BR para presidente) e sequencial: o sequencial se repete entre estados
# em 2002 e 2006 (ADR 0017).
# O landing guarda o pacote original, com hash.

source: tse
power: judiciario
level: federal
description: Tribunal Superior Eleitoral, dados abertos (CKAN; pacotes .zip com CSV)

access:
  base_url: https://cdn.tse.jus.br/estatistica/sead/odsele
  format: csv
  delimiter: ";"
  encoding: latin-1

datasets:
  candidaturas:
    url: "{base_url}/consulta_cand/consulta_cand_{year}.zip"
    load: yearly
    first_year: 1998                # primeira eleição geral cujos votos a plataforma tem
    step: 4                         # só as eleições gerais (1998, 2002, ... 2022, 2026)
    stable_after_years: 4           # o incremental confere a eleição corrente e a anterior
    archive: zip
    member: "*_BRASIL.csv"
    write: merge
    primary_key: [ANO_ELEICAO, SG_UE, SQ_CANDIDATO, NR_TURNO]
    columns:
      [ANO_ELEICAO, NR_TURNO, SG_UF, SG_UE, DS_CARGO, SQ_CANDIDATO, NR_CANDIDATO, NM_CANDIDATO, NM_URNA_CANDIDATO,
       DS_SITUACAO_CANDIDATURA, SG_PARTIDO, NM_PARTIDO, DT_NASCIMENTO, DS_GENERO, DS_SIT_TOT_TURNO]

  bens:
    # Bens declarados por cada candidato (todos os cargos): descrição, tipo e valor. Liga-se à candidatura por
    # SQ_CANDIDATO. Só existe de 2006 em diante. Não há documento pessoal nestas colunas.
    url: "{base_url}/bem_candidato/bem_candidato_{year}.zip"
    load: yearly
    first_year: 2006
    step: 4
    stable_after_years: 4
    archive: zip
    member: "*_BRASIL.csv"
    write: merge
    primary_key: [_row_hash]        # o número do bem não é único em 2006: a chave é o conteúdo da linha
    aliases:                        # os arquivos de 2006 e 2010 usam outros nomes
      NR_ORDEM_CANDIDATO: NR_ORDEM_BEM_CANDIDATO
      DT_ULTIMA_ATUALIZACAO: DT_ULT_ATUAL_BEM_CANDIDATO
    columns:
      [ANO_ELEICAO, SG_UF, SG_UE, SQ_CANDIDATO, NR_ORDEM_BEM_CANDIDATO, CD_TIPO_BEM_CANDIDATO, DS_TIPO_BEM_CANDIDATO,
       DS_BEM_CANDIDATO, VR_BEM_CANDIDATO, DT_ULT_ATUAL_BEM_CANDIDATO]

  votacao:
    # Votos de cada candidato (todos os cargos) por município e zona: cerca de 9,4 milhões de linhas e 4,3 GB só
    # em 2022. Pesado: peça por ano (`--years 2022`). O nome social não entra (minimização).
    url: "{base_url}/votacao_candidato_munzona/votacao_candidato_munzona_{year}.zip"
    load: yearly
    first_year: 1998
    step: 4
    stable_after_years: 4
    archive: zip
    member: "*_BRASIL.csv"
    write: merge
    primary_key: [_row_hash]
    columns:
      [ANO_ELEICAO, NR_TURNO, TP_ABRANGENCIA, SG_UF, SG_UE, NM_UE, CD_MUNICIPIO, NM_MUNICIPIO, NR_ZONA, CD_CARGO,
       DS_CARGO, SQ_CANDIDATO, NR_CANDIDATO, NM_CANDIDATO, NM_URNA_CANDIDATO, DS_SITUACAO_CANDIDATURA,
       DS_DETALHE_SITUACAO_CAND, NR_PARTIDO, SG_PARTIDO, SG_FEDERACAO, ST_VOTO_EM_TRANSITO, QT_VOTOS_NOMINAIS,
       NM_TIPO_DESTINACAO_VOTOS, QT_VOTOS_NOMINAIS_VALIDOS, DS_SIT_TOT_TURNO]
