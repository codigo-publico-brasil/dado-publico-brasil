source: dou
power: executivo
level: federal
description: Diário Oficial da União, arquivos XML mensais por seção, como a Imprensa Nacional publica
# Regra de extração: o DOU publica todo dia útil; a execução diária confere só o mês em curso (o zip do mês é reescrito a
# cada atualização, e cada versão fica no landing). Meses anteriores só quando pedidos (`--years`, a partir de first_month).
schedule: "30 7 * * *"            # captura automática (cron, fuso America/Sao_Paulo); sem esta linha, só quando pedido

access:
  # A página do mês lista um zip por seção. Licença CC BY-ND 3.0: guardar e ler é livre; redistribuir
  # trecho modificado não (ver docs/03-consultar/03-fontes-de-dados.md). Sem tabela no raw: só o landing.
  base_url: https://www.in.gov.br/acesso-a-informacao/dados-abertos/base-de-dados
  headers:
    Accept: "*/*"

datasets:
  secao1:
    # Seção 1: atos normativos (leis, decretos, portarias, resoluções). A partição é o mês (AAAAMM).
    url: "{base_url}?ano={year}&secao=1"
    load: yearly
    partition: month
    first_month: 202608
    archive: zip
    member: "*.xml"                # a conferência de integridade exige ao menos um XML no pacote
    raw: false

  secao2:
    # Seção 2: atos de pessoal (nomeações, exonerações, aposentadorias).
    url: "{base_url}?ano={year}&secao=2"
    load: yearly
    partition: month
    first_month: 202608
    archive: zip
    member: "*.xml"                # a conferência de integridade exige ao menos um XML no pacote
    raw: false

  secao3:
    # Seção 3: contratos, licitações, editais e outros avisos.
    url: "{base_url}?ano={year}&secao=3"
    load: yearly
    partition: month
    first_month: 202608
    archive: zip
    member: "*.xml"                # a conferência de integridade exige ao menos um XML no pacote
    raw: false
