# Declaração da fonte: Câmara dos Deputados, dados abertos (arquivos CSV em lote).
#
# Diz O QUE receber e COMO carregar no raw. Não transforma nada: renomear, tipar e padronizar é
# trabalho do dbt (camada staging). `columns` é a lista permitida: só estas colunas do arquivo são
# lidas (minimização de dados, princípio IX). Documentos pessoais (cpf, rg...) são recusados.
#
# Por dataset:
#   url               endereço oficial; `{year}` nos anuais
#   load              full (um arquivo) | yearly (um arquivo por partição)
#   partition         (yearly) year (padrão, `{year}`) | sequence (`{partition}`, calculada do ano por `sequence`) | month (AAAAMM)
#   schedule          cron de 5 campos (fuso America/Sao_Paulo) da captura automática; sem ele, só quando pedido
#   first_year        (yearly) primeiro ano que a fonte publica; anos anteriores não são pedidos
#   extra_years       (yearly) aceita anos só deste dataset (opção --extra-years)
#   write             merge (upsert pela chave) | replace (troca o conteúdo anterior)
#   primary_key       `_row_hash` identifica a linha pelo conteúdo, para arquivos sem chave natural
#   primary_key       colunas da chave natural
#   columns           colunas lidas, com o nome que têm no arquivo

source: camara
power: legislativo     # legislativo | executivo | judiciario (e a pasta onde este arquivo mora)
level: federal          # federal | estadual | municipal; o raw vira raw_federal_camara
description: Câmara dos Deputados, dados abertos (arquivos em lote)

# Regra de extração: a Câmara muda todo dia; a execução diária confere só o ano em curso (e os datasets completos). O que
# é retroativo (anos anteriores) só roda quando pedido: `--years` ou `--historical --from-year`.
schedule: "0 1 * * *"            # captura noturna (cron, fuso America/Sao_Paulo; escalonada 01:00-02:20, ADR 0042); sem esta linha, só quando pedido

access:
  base_url: https://dadosabertos.camara.leg.br/arquivos
  format: csv
  delimiter: ";"
  encoding: utf-8-sig

datasets:
  deputados:
    url: "{base_url}/deputados/csv/deputados.csv"
    max_age_days: 3   # avisa se a última verificação passar de 3 dias
    load: full
    write: merge
    primary_key: [uri]
    columns:
      [uri, nome, nomeCivil, siglaSexo, dataNascimento, dataFalecimento, ufNascimento,
       municipioNascimento, urlRedeSocial, urlWebsite, idLegislaturaInicial, idLegislaturaFinal]

  deputadosProfissoes:
    url: "{base_url}/deputadosProfissoes/csv/deputadosProfissoes.csv"
    load: full
    write: replace
    # ~1.070 deputados vêm sem profissão (titulo e dataHora vazios, codTipoProfissao 0): o arquivo os lista mesmo assim.
    # Com chave [id, titulo] o loader as rejeitava (erro de perda); pelo conteúdo, o raw guarda todas as linhas da fonte.
    primary_key: [_row_hash]
    columns: [id, codTipoProfissao, titulo, dataHora]

  deputadosOcupacoes:
    url: "{base_url}/deputadosOcupacoes/csv/deputadosOcupacoes.csv"
    load: full
    write: replace
    columns: [id, titulo, entidade, entidadeUF, entidadePais, anoInicio, anoFim]

  proposicoes:
    url: "{base_url}/proposicoes/csv/proposicoes-{year}.csv"
    max_age_days: 3   # avisa se a última verificação passar de 3 dias
    load: yearly
    extra_years: true
    write: merge
    primary_key: [id]
    columns:
      [id, siglaTipo, numero, ano, descricaoTipo, ementa, dataApresentacao, urlInteiroTeor,
       ultimoStatus_dataHora, ultimoStatus_siglaOrgao, ultimoStatus_descricaoSituacao,
       ultimoStatus_descricaoTramitacao, ultimoStatus_regime, ultimoStatus_apreciacao]

  proposicoesAutores:
    url: "{base_url}/proposicoesAutores/csv/proposicoesAutores-{year}.csv"
    load: yearly
    extra_years: true
    write: merge
    primary_key: [idProposicao, ordemAssinatura, nomeAutor]
    columns:
      [idProposicao, idDeputadoAutor, codTipoAutor, tipoAutor, nomeAutor, siglaPartidoAutor,
       siglaUFAutor, ordemAssinatura, proponente, uriAutor]

  votacoes:
    url: "{base_url}/votacoes/csv/votacoes-{year}.csv"
    max_age_days: 3   # avisa se a última verificação passar de 3 dias
    load: yearly
    write: merge
    primary_key: [id]
    columns:
      [id, data, dataHoraRegistro, idOrgao, siglaOrgao, idEvento, aprovacao, votosSim, votosNao,
       votosOutros, descricao]

  votacoesVotos:
    url: "{base_url}/votacoesVotos/csv/votacoesVotos-{year}.csv"
    max_age_days: 3   # avisa se a última verificação passar de 3 dias
    load: yearly
    first_year: 2001
    write: merge
    primary_key: [idVotacao, deputado_id]
    tolerated_rejects:   # a própria fonte traz 1 linha de 24.903 sem deputado_id em 2004; continua registrada e contada
      2004: {limit: 1, reason: linha da fonte sem identificador do deputado}
    columns:
      [idVotacao, dataHoraVoto, voto, deputado_id, deputado_nome, deputado_siglaPartido,
       deputado_uriPartido, deputado_siglaUf, deputado_idLegislatura, deputado_urlFoto]

  votacoesOrientacoes:
    url: "{base_url}/votacoesOrientacoes/csv/votacoesOrientacoes-{year}.csv"
    load: yearly
    first_year: 2003
    write: merge
    primary_key: [idVotacao, siglaBancada]
    columns: [idVotacao, siglaBancada, orientacao]

  votacoesProposicoes:
    url: "{base_url}/votacoesProposicoes/csv/votacoesProposicoes-{year}.csv"
    load: yearly
    write: merge
    primary_key: [idVotacao, proposicao_id]
    columns: [idVotacao, proposicao_id]

  votacoesObjetos:
    url: "{base_url}/votacoesObjetos/csv/votacoesObjetos-{year}.csv"
    load: yearly
    write: merge
    primary_key: [idVotacao, proposicao_id]
    columns: [idVotacao, proposicao_id]

  legislaturas:
    url: "{base_url}/legislaturas/csv/legislaturas.csv"
    max_age_days: 3   # avisa se a última verificação passar de 3 dias
    load: full
    write: merge
    primary_key: [idLegislatura]
    columns: [idLegislatura, dataInicio, dataFim, anoEleicao]

  partidos:
    url: "{base_url}/partidos/csv/partidos.csv"
    max_age_days: 3   # avisa se a última verificação passar de 3 dias
    load: full
    write: merge
    primary_key: [id]
    columns: [id, sigla, nome]

  orgaos:
    url: "{base_url}/orgaos/csv/orgaos.csv"
    load: full
    write: merge
    primary_key: [uri]
    columns:
      [uri, sigla, apelido, nome, codTipoOrgao, tipoOrgao, dataInicio, dataInstalacao, dataFim,
       descricaoSituacao, casa]

  orgaosDeputados:
    url: "{base_url}/orgaosDeputados/csv/orgaosDeputados-L{partition}.csv"
    load: yearly
    partition: sequence
    sequence: {first_year: 2019, first_value: 56, years: 4}   # legislatura federal: a 56ª começou em 2019
    write: merge
    primary_key: [_row_hash]
    columns:
      [uriOrgao, siglaOrgao, uriDeputado, nomeDeputado, siglaPartido, siglaUF, cargo, dataInicio, dataFim]

  frentes:
    url: "{base_url}/frentes/csv/frentes.csv"
    load: full
    write: merge
    primary_key: [id]
    columns: [id, titulo, dataCriacao, idLegislatura, situacao, coordenador_id]

  frentesDeputados:
    url: "{base_url}/frentesDeputados/csv/frentesDeputados.csv"
    load: full
    write: merge
    primary_key: [_row_hash]
    columns:
      [id, deputado_.id, deputado_.idLegislatura, deputado_.urlFoto, deputado_.codTitulo, deputado_.titulo,
       dataInicio, dataFim]

  deputados_historico:
    # Por item: o histórico de situação de cada deputado (posse, licença, fim de mandato). Dá o início e o fim do
    # mandato em `marts.mandatos`. O item é o endereço do deputado em `deputados` (`uri`); e-mail e foto que a
    # resposta traz não estão em `columns` e nunca entram no raw. Roda só com `--foreach N` ou `--foreach all`.
    url: "{item}/historico"
    load: foreach
    format: json
    headers: {Accept: application/json}
    records: dados
    write: merge
    foreach:
      from: deputados
      item: uri
      refresh_after_days: 30
      batch_size: 500
    primary_key: [_item, _row_hash]
    columns:
      [_item, idLegislatura, dataHora, situacao, condicaoEleitoral, descricaoStatus, nome, nomeEleitoral,
       siglaPartido, siglaUf]

  deputados_detalhe:
    # Por item: o cadastro de cada deputado (escolaridade, último status e gabinete institucional). O item é o
    # endereço do deputado em `deputados` (`uri`). CPF, e-mail pessoal e foto não estão em `columns` e nunca entram
    # no raw (ADR 0029). Roda só com `--foreach N` ou `--foreach all`.
    url: "{item}"
    load: foreach
    format: json
    headers: {Accept: application/json}
    records: dados
    write: merge
    foreach:
      from: deputados
      item: uri
      refresh_after_days: 30
      batch_size: 500
    primary_key: [_item]
    columns:
      [_item, escolaridade, ultimoStatus__nomeEleitoral, ultimoStatus__siglaPartido, ultimoStatus__siglaUf,
       ultimoStatus__idLegislatura, ultimoStatus__situacao, ultimoStatus__condicaoEleitoral, ultimoStatus__data,
       ultimoStatus__gabinete__nome, ultimoStatus__gabinete__predio, ultimoStatus__gabinete__sala,
       ultimoStatus__gabinete__andar, ultimoStatus__gabinete__telefone, ultimoStatus__gabinete__email]

  proposicoes_tramitacoes:
    # Por item: uma chamada à API para cada proposição que pode virar norma (não existe arquivo em lote).
    # Só entram PL, PLP, PEC, MPV, PDL, PLV, PLN e PRC; requerimentos, pareceres e emendas ficam de fora.
    # Roda só com `--foreach N` (os N itens mais recentes que faltam) ou `--foreach all`.
    url: "https://dadosabertos.camara.leg.br/api/v2/proposicoes/{item}/tramitacoes"
    load: foreach
    format: json
    headers: {Accept: application/json}
    records: dados
    write: merge
    foreach:
      from: proposicoes
      item: id
      where: "sigla_tipo IN ('PL', 'PLP', 'PEC', 'MPV', 'PDL', 'PLV', 'PLN', 'PRC')"
      recent_by: data_apresentacao
      version: ultimo_status_data_hora   # mudou a última situação: busca de novo
      batch_size: 500
    # A fonte repete `sequencia` dentro da mesma proposição com outra hora (visto em 2026); sem `dataHora` na chave,
    # o merge juntava dois andamentos diferentes e perdia um.
    primary_key: [_item, sequencia, dataHora]
    columns:
      [_item, sequencia, dataHora, siglaOrgao, regime, descricaoTramitacao, codTipoTramitacao,
       descricaoSituacao, codSituacao, despacho, ambito, apreciacao]

