# Declaração da fonte: Senado Federal, dados abertos (API REST, JSON). Sem código próprio: a janela de
# datas vai na URL e o JSON é lido pelo caminho dos registros. Campos aninhados viram `a__b`; listas
# (`nested`: `votos`, `Mandatos__Mandato`) viram tabelas filhas no raw. Ver ingestion/fetch.py e ingestion/read.py.

source: senado
power: legislativo
level: federal
description: Senado Federal, dados abertos (API REST, JSON)

# Regra de extração: o Senado muda todo dia; a execução diária confere só o ano em curso (e os datasets completos). O que
# é retroativo (anos anteriores) só roda quando pedido: `--years` ou `--historical --from-year`.
schedule: "30 6 * * *"            # captura automática (cron, fuso America/Sao_Paulo); sem esta linha, só quando pedido

access:
  base_url: https://legis.senado.leg.br/dadosabertos
  format: json
  headers: {Accept: application/json}

datasets:
  senadores:
    # Um arquivo por legislatura, com os mandatos que a tocam. O mesmo senador aparece em várias; a
    # linha é identificada pelo conteúdo, e o staging fica com uma linha por senador.
    url: "{base_url}/senador/lista/legislatura/{legislature}"
    load: yearly
    partition: legislature
    first_year: 1999
    write: merge
    records: ListaParlamentarLegislatura.Parlamentares.Parlamentar
    primary_key: [_row_hash]
    columns:
      [IdentificacaoParlamentar__CodigoParlamentar, IdentificacaoParlamentar__NomeParlamentar,
       IdentificacaoParlamentar__NomeCompletoParlamentar, IdentificacaoParlamentar__SexoParlamentar,
       Mandatos__Mandato]
    nested: [Mandatos__Mandato]

  votacoes:
    # Votações em plenário de um ano, cada uma com a lista de votos nominais (`votos`). Votação secreta
    # traz a sigla "Votou" no lugar da escolha.
    url: "{base_url}/votacao?dataInicio={year}-01-01&dataFim={year}-12-31"
    load: yearly
    first_year: 1999
    write: merge
    primary_key: [codigoSessaoVotacao]
    columns:
      [codigoSessaoVotacao, codigoSessao, dataSessao, siglaTipoSessao, votacaoSecreta, resultadoVotacao,
       totalVotosSim, totalVotosNao, totalVotosAbstencao, descricaoVotacao, codigoMateria, idProcesso,
       identificacao, sigla, numero, ano, dataApresentacao, ementa, informeLegislativo__siglaColegiado,
       informeLegislativo__nomeColegiado, votos]
    nested: [votos]

  processos:
    # Por item: o processo de cada matéria votada (situação atual, norma gerada, autoria). O corpo inteiro
    # fica no landing; só estes campos vão ao raw (tramitação e informes ainda não).
    url: "{base_url}/processo/{item}"
    load: foreach
    write: merge
    foreach:
      from: votacoes
      item: id_processo
      recent_by: data_sessao
      refresh_after_days: 30
      batch_size: 200
    primary_key: [_item]
    columns:
      [_item, id, codigoMateria, identificacao, sigla, numero, ano, tramitando, situacaoAtual,
       siglaSituacaoAtual, dataSituacaoAtual, dataInicioEfetivo, siglaCasaIniciadora,
       normaGerada__codigo, normaGerada__siglaTipo, normaGerada__tipo, normaGerada__numero,
       normaGerada__anoAssinatura, normaGerada__dataAssinatura, normaGerada__descricao,
       normaGerada__dataPublicacao, normaGerada__siglaVeiculoPublicacao, autoriaIniciativa]
    nested: [autoriaIniciativa]

  senadores_detalhe:
    # Por item: uma chamada por senador, para a data de nascimento, a naturalidade e a foto. E-mail, telefone e
    # endereço do gabinete que a resposta traz não estão em `columns` e nunca entram no raw.
    url: "{base_url}/senador/{item}"
    load: foreach
    write: merge
    records: DetalheParlamentar.Parlamentar
    foreach:
      from: senadores
      item: identificacao_parlamentar_codigo_parlamentar
      batch_size: 200
    primary_key: [_item]
    columns:
      [_item, IdentificacaoParlamentar__CodigoParlamentar, IdentificacaoParlamentar__NomeCompletoParlamentar,
       IdentificacaoParlamentar__UrlFotoParlamentar, DadosBasicosParlamentar__DataNascimento,
       DadosBasicosParlamentar__Naturalidade, DadosBasicosParlamentar__UfNaturalidade]


  normas:
    # Catálogo de todas as normas federais (leis, decretos, medidas provisórias, emendas...), por ano de
    # assinatura, de 1808 em diante. Só os metadados; o texto não vem desta API.
    url: "{base_url}/legislacao/lista?ano={year}"
    load: yearly
    first_year: 1808
    write: merge
    records: ListaDocumento.documentos.documento
    primary_key: [id]
    columns:
      [id, tipo, descricao, numero, norma, normaNome, ementa, dataassinatura, anoassinatura, apelido]

  normas_detalhe:
    # Por item: publicações no DOU e relações com outros atos (alteração, regulamentação, veto) das leis, leis
    # complementares, emendas e medidas provisórias. ~25 mil normas: por amostra das mais recentes.
    url: "{base_url}/legislacao/{item}"
    load: foreach
    write: merge
    records: DetalheDocumento.documentos.documento
    foreach:
      from: normas
      item: id
      where: "tipo IN ('EMC-n', 'EMC-sn', 'LCP', 'LEI-n', 'LEI-sn', 'MPV-cs', 'MPV-ss')"
      recent_by: anoassinatura
      refresh_after_days: 90
      batch_size: 200
    primary_key: [_item]
    columns:
      [_item, id, identificacao__tipo, identificacao__descricao, identificacao__numero, identificacao__norma,
       identificacao__normaNome, identificacao__dataassinatura, identificacao__apelido,
       identificacao__urlDocumento, ementa, publicacoes__publicacao, vides__vide]
    nested: &detalhe_listas [publicacoes__publicacao, vides__vide]

  normas_detalhe_constituicao:
    # A Constituição de 1988 (norma 579494) tem 641 relações (quem a alterou, regulamentou e interpretou):
    # um documento só, fora da amostra do dataset por item (é de 1988, não é das mais recentes).
    url: "{base_url}/legislacao/579494"
    load: full
    write: merge
    records: DetalheDocumento.documentos.documento
    primary_key: [id]
    columns: [id, identificacao__tipo, identificacao__descricao, identificacao__numero, identificacao__norma,
              identificacao__normaNome, identificacao__dataassinatura, identificacao__apelido,
              identificacao__urlDocumento, ementa, publicacoes__publicacao, vides__vide]
    nested: *detalhe_listas

  vetos:
    # Vetos presidenciais apreciados pelo Congresso, por ano, de 1994 em diante (antes disso a API não devolve).
    url: "{base_url}/materia/vetos/{year}"
    load: yearly
    first_year: 1994
    write: merge
    records: ListaVetosAnoCN.Vetos.Veto
    primary_key: [Codigo]
    columns:
      [Codigo, Materia__Codigo, Materia__Numero, Materia__Ano, Materia__EmTramitacao, MateriaVetada__Codigo,
       MateriaVetada__Sigla, MateriaVetada__Numero, MateriaVetada__Ano, MateriaVetada__Ementa,
       MateriaVetada__NormaGerada__CodigoNorma, MateriaVetada__NormaGerada__NomeNorma,
       Mensagem__Sigla, Mensagem__Numero, Mensagem__Ano, Mensagem__UrlPlanalto, Total, Assunto,
       DataRecebimentoCongresso, DataPublicacao, DataSobrestacaoPauta, SobrestandoPauta,
       QuantidadeDispositivos]

  vetos_dispositivos:
    # Por item: cada dispositivo vetado (texto vetado, razão do veto, situação) e a data da sessão. O item é
    # o código da matéria do veto (`_item`); o resultado do plenário é o da fonte, sem inferência.
    url: "{base_url}/plenario/resultado/veto/materia/{item}"
    load: foreach
    write: merge
    records: ResultadoVetoMateriaCN.Veto.Dispositivos.Dispositivo
    foreach:
      from: vetos
      item: materia_codigo
      recent_by: data_publicacao
      refresh_after_days: 30
      batch_size: 100
    primary_key: [_item, Codigo]
    columns:
      [_item, Codigo, Identificador, Descricao, Conteudo, RazaoVeto, Situacao, PossuiVotos, TipoVotacao,
       DataSessao]

  vetos_votos:
    # Por item: o voto nominal de cada deputado e senador num dispositivo vetado votado em painel. A fonte
    # entrega nome, partido e UF, sem o código do parlamentar: não é ligado a pessoas (ADR 0013).
    url: "{base_url}/plenario/resultado/veto/dispositivo/{item}"
    load: foreach
    write: merge
    records: ResultadoVetoDispositivoCN.Votacao
    foreach:
      from: vetos_dispositivos
      item: codigo
      where: "possui_votos = 'Sim'"
      recent_by: data_sessao
      batch_size: 50
    primary_key: [_item]
    columns: [_item, ParteVetada, TipoVotacao, Sessao, Camara__Voto, Senado__Voto]
    nested: [Camara__Voto, Senado__Voto]
