source: constituicao
power: legislativo
level: federal
description: Constituição de 1988, texto atualizado até a última emenda, como a Câmara dos Deputados publica
# Regra de extração: o texto muda só com cada emenda; a execução diária só confere a página (e baixa se mudou).
schedule: "15 7 * * *"            # captura automática (cron, fuso America/Sao_Paulo); sem esta linha, só quando pedido

access:
  base_url: https://www2.camara.leg.br/atividade-legislativa/legislacao/constituicao1988
  format: html

datasets:
  constituicao:
    # O link do arquivo muda a cada emenda: o módulo próprio da fonte lê a página, acha o link atual e guarda o
    # arquivo original com hash. Cada versão nova substitui a anterior no raw; as antigas ficam no landing.
    url: "{base_url}?parte=constituicao"
    max_age_days: 3   # avisa se a última verificação passar de 3 dias
    load: full
    write: replace
    columns: [ordem, linha, emenda_do_arquivo]

  adct:
    # Ato das Disposições Constitucionais Transitórias, do mesmo site, atualizado em separado.
    url: "{base_url}?parte=adct"
    max_age_days: 3   # avisa se a última verificação passar de 3 dias
    load: full
    write: replace
    columns: [ordem, linha, emenda_do_arquivo]
