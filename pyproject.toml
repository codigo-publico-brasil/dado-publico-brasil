[project]
name = "plataforma-dados"
version = "0.0.0"
description = "Plataforma de dados públicos abertos: captura das fontes oficiais, transformação em camadas, identidade de pessoas, documentos e vetores."
requires-python = ">=3.13"
# Base mínima; cada motor traz o que precisa em um extra (`uv sync --all-extras` instala tudo).
dependencies = ["pyyaml>=6.0", "duckdb>=1.1"]

[project.optional-dependencies]
ingestion = ["dlt[duckdb]>=1.5"]
transformation = ["dbt-core>=1.9", "dbt-duckdb>=1.9"]
orchestration = [
    "plataforma-dados[ingestion,transformation]",
    "dagster>=1.9",
    "dagster-dbt>=0.25",
    "dagster-dlt>=0.25",
    "dagster-webserver>=1.9",
]

[project.scripts]
plataforma = "plataforma_dados.orchestration.__main__:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plataforma_dados"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Testes têm SQL e dados sintéticos em linhas longas.
"tests/**" = ["E501"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src:tests/support"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]
