[project]
name = "dado-publico-brasil"
version = "0.0.0"
description = "Plataforma de dados públicos abertos: captura das fontes oficiais, transformação em camadas, identidade de pessoas, documentos e vetores."
requires-python = ">=3.13"
# Base mínima; cada motor traz o que precisa em um extra (`uv sync --all-extras` instala tudo).
dependencies = ["pyyaml>=6.0", "duckdb>=1.1"]

[project.optional-dependencies]
ingestion = ["dlt[duckdb,parquet]>=1.5"]
transformation = ["dbt-core>=1.9", "dbt-duckdb>=1.9"]
orchestration = [
    "dado-publico-brasil[ingestion,transformation]",
    "dagster>=1.9",
    "dagster-dbt>=0.25",
    "dagster-dlt>=0.25",
    "dagster-webserver>=1.9",
]

[project.scripts]
dado-publico = "dado_publico_brasil.orchestration.__main__:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dado_publico_brasil"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C90"]
# Regras globais desligadas, cada uma com o motivo (issue 270):
# S101: `assert` é o jeito de testar e de estreitar tipo para o mypy.
# S608: o SQL é montado com identificadores do próprio código/YAML versionado, nunca com entrada externa.
# S603/S607: subprocess com argumentos fixos (git, dbt, uv), sem shell.
# S310: as URLs abertas vêm da declaração versionada da fonte (`sources/`), não de entrada do usuário.
# S314: o XML analisado é a resposta do nosso próprio armazenamento de objetos.
ignore = ["S101", "S608", "S603", "S607", "S310", "S314"]

[tool.ruff.lint.mccabe]
# Teto acima da maior função atual (22), para barrar piora sem exigir refatoração agora.
max-complexity = 22

[tool.ruff.lint.per-file-ignores]
# Testes têm SQL e dados sintéticos em linhas longas.
# S701 e SIM115 valem para código de produção, não para fixtures.
"tests/**" = ["E501", "S701", "SIM115"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src:tests/support"
files = ["src", "tests"]

[tool.coverage.run]
source = ["dado_publico_brasil"]
branch = true

[tool.coverage.report]
# Relatório sem piso (ADR 0048); `show_missing` lista as linhas sem teste.
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]
